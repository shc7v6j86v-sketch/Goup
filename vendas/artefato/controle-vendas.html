<title>Controle de Vendas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral escura fixa + área de trabalho clara com cartões e tabelas */
:root {
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --bg: #f3f4f0; --surface: #fcfcfa; --surface-2: #eeefea; --border: #e0e1da;
  --text: #121311; --text-2: #4e4f4a; --muted: #82837c; --accent: #2a78d6;
  --good: #0a7d0a; --good-bg: #e3f2e3; --bad: #c22f2f; --bad-bg: #fbe8e8; --warn: #8a5a00; --warn-bg: #fcf0d6;
  --alert-bad-fg: #7a1d1d; --alert-warn-fg: #5e3d00; --alert-good-fg: #0d4f0d;
  --grid: #e9eae4; --axis: #d4d5ce; --neutral-a: #c9cac3; --neutral-b: #3d3e39; --bar: #8a8b84;
  --seg-1: #8a8b84; --seg-2: #b6b7b0; --seg-3: #d6d7d0; --tooltip: #151614;
  --side-bg: #151614; --side-fg: #e8e9e4; --side-muted: #8a8b84; --side-hover: #22231f; --side-active: #2d2e29;
  --primary-bg: #151614; --primary-fg: #ffffff; --input-bg: #ffffff; --row-hover: #f5f6f1;
  --overlay: rgba(15,16,12,.45); --focus: rgba(42,120,214,.22);
  --c-amazon: #1baf7a; --c-shopee: #e34948; --c-mercadolivre: #eda100; --c-magalu: #2a78d6;
  --ink-amazon: #0b0b0b; --ink-shopee: #ffffff; --ink-mercadolivre: #0b0b0b; --ink-magalu: #ffffff;
  --pc: var(--accent); --pc-ink: #ffffff;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111210; --surface: #1a1b19; --surface-2: #242522; --border: #2f302c;
    --text: #f0f0ec; --text-2: #c3c4b8; --muted: #8e8f86; --accent: #3987e5;
    --good: #46c246; --good-bg: #16301a; --bad: #ef6b6b; --bad-bg: #3a1c1c; --warn: #f0b440; --warn-bg: #36290f;
    --alert-bad-fg: #f5c2c2; --alert-warn-fg: #f5dfae; --alert-good-fg: #bfe9bf;
    --grid: #2a2b27; --axis: #3b3c37; --neutral-a: #55564f; --neutral-b: #d9dad3; --bar: #77786f;
    --seg-1: #9a9b93; --seg-2: #64655e; --seg-3: #45463f; --tooltip: #000000;
    --side-bg: #0b0c0a; --side-fg: #e8e9e4; --side-muted: #85867f; --side-hover: #1c1d1a; --side-active: #262723;
    --primary-bg: #f0f0ec; --primary-fg: #121311; --input-bg: #141513; --row-hover: #20211e;
    --overlay: rgba(0,0,0,.6); --focus: rgba(57,135,229,.3);
    --c-mercadolivre: #c98500;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111210; --surface: #1a1b19; --surface-2: #242522; --border: #2f302c;
  --text: #f0f0ec; --text-2: #c3c4b8; --muted: #8e8f86; --accent: #3987e5;
  --good: #46c246; --good-bg: #16301a; --bad: #ef6b6b; --bad-bg: #3a1c1c; --warn: #f0b440; --warn-bg: #36290f;
  --alert-bad-fg: #f5c2c2; --alert-warn-fg: #f5dfae; --alert-good-fg: #bfe9bf;
  --grid: #2a2b27; --axis: #3b3c37; --neutral-a: #55564f; --neutral-b: #d9dad3; --bar: #77786f;
  --seg-1: #9a9b93; --seg-2: #64655e; --seg-3: #45463f; --tooltip: #000000;
  --side-bg: #0b0c0a; --side-fg: #e8e9e4; --side-muted: #85867f; --side-hover: #1c1d1a; --side-active: #262723;
  --primary-bg: #f0f0ec; --primary-fg: #121311; --input-bg: #141513; --row-hover: #20211e;
  --overlay: rgba(0,0,0,.6); --focus: rgba(57,135,229,.3);
  --c-mercadolivre: #c98500;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--side-bg); color: var(--side-fg); padding: 20px 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#2a78d6,#1baf7a); display: grid; place-items: center; font-weight: 800; color: #fff; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.15; }
.brand-sub { font-size: 11px; color: var(--side-muted); }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--side-muted); padding: 14px 10px 6px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--side-fg); opacity: .86; text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--side-hover); opacity: 1; }
.nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav a.active { background: var(--side-active); opacity: 1; }
.nav .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.nav .ico { width: 18px; text-align: center; flex: none; opacity: .85; }
.sidebar-foot { margin-top: auto; font-size: 11px; color: var(--side-muted); padding: 12px 10px 0; display: flex; flex-direction: column; gap: 6px; }

.main { min-width: 0; padding-block: 24px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-title { display: flex; align-items: center; gap: 12px; }
.page-title h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.page-title .sub { color: var(--text-2); font-size: 13px; }
.plat-badge { width: 40px; height: 40px; border-radius: 10px; background: var(--pc); color: var(--pc-ink); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.mobile-bar { display: none; }

/* ---------- Controls ---------- */
.btn {
  border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: var(--primary-bg); }
.btn.primary:hover { opacity: .88; }
.btn:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, .tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.plat { background: var(--pc); border-color: var(--pc); color: var(--pc-ink); }
.btn.plat:hover { filter: brightness(.94); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 9px; font-size: 12px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.icon-btn { border: 0; background: transparent; cursor: pointer; padding: 5px 7px; border-radius: 6px; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover { color: var(--bad); background: var(--bad-bg); }

input[type=text], input[type=number], input[type=date], input[type=password], input[type=url], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
textarea { resize: vertical; min-height: 64px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); font-weight: 600; }
label.field .hint { font-weight: 400; color: var(--muted); font-size: 11px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--text-2); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.search { max-width: 260px; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tabs a {
  padding: 10px 14px; text-decoration: none; color: var(--text-2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tabs a:hover { color: var(--text); }
.tabs a.on { color: var(--text); border-bottom-color: var(--pc); }

/* ---------- Cards / KPIs ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; }
.card .card-sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .k-label { font-size: 12px; color: var(--text-2); font-weight: 600; }
.kpi .k-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 4px; }
.kpi .k-foot { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.kpi.hl { border-color: var(--pc); box-shadow: inset 3px 0 0 var(--pc), var(--shadow); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: 2fr 1fr; }
.g31 { grid-template-columns: 1fr 1fr 1fr; }
.chart-box { position: relative; height: 280px; }
.chart-box.tall { height: 340px; }
.chart-box.short { height: 230px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 11.5px; color: var(--text-2); font-weight: 700; background: var(--surface-2); position: sticky; top: 0; text-transform: uppercase; letter-spacing: .03em; cursor: default; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
td.r, th.r { text-align: right; }
tbody tr:hover { background: var(--row-hover); }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--border); border-bottom: 0; }
.prod-name { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; display: block; }
.prod-sku { font-size: 11px; color: var(--muted); }
.actions { display: flex; gap: 2px; justify-content: flex-end; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--text-2); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill .pdot { width: 8px; height: 8px; border-radius: 50%; }

.empty { text-align: center; padding: 40px 20px; color: var(--text-2); }
.empty .big { font-size: 34px; margin-bottom: 6px; }
.empty p { margin: 4px 0 14px; }

/* ---------- Alerts ---------- */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
.alert.bad { background: var(--bad-bg); color: var(--alert-bad-fg); }
.alert.warn { background: var(--warn-bg); color: var(--alert-warn-fg); }
.alert.good { background: var(--good-bg); color: var(--alert-good-fg); }
.alert .a-ico { font-weight: 800; flex: none; }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; background: var(--overlay); padding-top: calc(30px + env(safe-area-inset-top, 0px)) !important; display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 920px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.sm { max-width: 520px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 18px 20px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
.form-section { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 16px 0 8px; }
.form-section:first-child { margin-top: 0; }
.fgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.fgrid .span2 { grid-column: span 2; }
.fgrid .span4 { grid-column: 1 / -1; }
.fgrid .span3 { grid-column: span 3; }
.form-layout { display: grid; grid-template-columns: 1fr 290px; gap: 20px; }
.preview { background: var(--surface-2); border-radius: 12px; padding: 14px; align-self: start; position: sticky; top: 0; }
.preview h4 { margin: 0 0 10px; font-size: 13px; }
.pv-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
.pv-row.sep { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }
.pv-row.total { font-weight: 700; font-size: 15px; }
.pv-row .lbl { color: var(--text-2); }
.pv-big { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.pv-big div { background: var(--surface); border-radius: 8px; padding: 8px 10px; }
.pv-big .t { font-size: 11px; color: var(--text-2); font-weight: 600; }
.pv-big .v { font-size: 16px; font-weight: 700; }
.bar100 { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 12px; gap: 2px; background: var(--surface); }
.bar100 span { display: block; height: 100%; }

/* ---------- Calculator ---------- */
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.calc-card { border-top: 4px solid var(--pc); }
.calc-card .price { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }

/* ---------- Toast & lock ---------- */
.toast { position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--primary-bg); color: var(--primary-fg); padding: 10px 18px; border-radius: 10px; font-weight: 600; z-index: 80; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mt { margin-top: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
details.help summary { cursor: pointer; font-weight: 600; color: var(--text-2); }
details.help { font-size: 13px; color: var(--text-2); }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .g3, .g31 { grid-template-columns: 1fr 1fr; }
  .calc-grid { grid-template-columns: 1fr 1fr; }
  .form-layout { grid-template-columns: 1fr; }
  .preview { position: static; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; height: auto; width: 260px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); z-index: 60; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; }
  .mobile-bar { display: flex; align-items: center; justify-content: space-between; background: var(--side-bg); color: var(--side-fg); top: env(safe-area-inset-top, 0px) !important; padding-left: max(16px, env(safe-area-inset-left, 0px)) !important; padding-right: max(16px, env(safe-area-inset-right, 0px)) !important; padding: 10px 16px; position: sticky; top: 0; z-index: 40; }
  .mobile-bar button { background: transparent; border: 0; color: var(--side-fg); font-size: 22px; cursor: pointer; }
  .main { padding-block: 16px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .g2, .g3, .g31 { grid-template-columns: 1fr; }
  .fgrid { grid-template-columns: 1fr 1fr; }
  .search { max-width: none; flex: 1; }
}
@media (max-width: 520px) {
  .calc-grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi .k-value { font-size: 18px; }
  .fgrid { grid-template-columns: 1fr; }
  .fgrid .span2, .fgrid .span3 { grid-column: auto; }
}

/* ---------- Artefato ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 70; background: var(--side-bg); }
h1, h2, h3 { text-wrap: balance; }
.card h3 { font-size: 14.5px; }
#banner:empty { display: none; }
#banner { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 13px; }
.banner > div { min-width: 0; flex: 1 1 260px; }
.banner.warn { background: var(--warn-bg); border-color: transparent; color: var(--alert-warn-fg); }
.banner.bad { background: var(--bad-bg); border-color: transparent; color: var(--alert-bad-fg); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--side-fg); }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--side-muted); flex: none; }
.sync.good::before { background: var(--good); }
.sync.warn::before { background: var(--warn); }
.sync.bad::before { background: var(--bad); }
.skel { position: relative; overflow: hidden; }
.skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--surface-2), transparent); animation: shimmer 1.4s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } .sidebar { transition: none; } }

</style>
<div class="mobile-bar">
  <button id="menuBtn" aria-label="Abrir menu">☰</button>
  <strong id="mobileTitle">Controle de Vendas</strong>
  <span style="width:22px"></span>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">CV</div>
      <div>
        <div class="brand-name" id="storeName">Minha Loja</div>
        <div class="brand-sub">Controle de vendas online</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><span id="syncNote" class="sync">Carregando seus dados…</span><span>Backup e exportação em Configurações.</span></div>
  </aside>
  <main class="main"><div id="banner"></div><div id="view"></div></main>
</div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
/* Controle de Vendas Online — Amazon, Shopee, Mercado Livre, Magalu
   Tudo roda no navegador; os dados ficam em localStorage. */
(function () {
  'use strict';

  // ---------------------------------------------------------------- Plataformas

  // ---------------------------------------------------------------- Armazenamento
  // Na sua conta Claude (capability db) quando disponível; senão, só neste navegador.
  const DB_KEY = 'cv_db_v1';
  function freshDB() {
    const platforms = {};
    PLATFORMS.forEach(p => { platforms[p.id] = Object.assign({}, p.defaults); });
    return { version: 1, settings: { storeName: 'Minha Loja', onboarded: false, platforms }, products: [], sales: [], expenses: [] };
  }
  function normalizeDB(d) {
    const base = freshDB();
    d = d && typeof d === 'object' ? d : {};
    d.settings = Object.assign(base.settings, d.settings || {});
    delete d.settings.pinHash;
    PLATFORMS.forEach(p => { d.settings.platforms[p.id] = Object.assign({}, p.defaults, (d.settings.platforms || {})[p.id] || {}); });
    d.products = Array.isArray(d.products) ? d.products : [];
    d.sales = Array.isArray(d.sales) ? d.sales : [];
    d.expenses = Array.isArray(d.expenses) ? d.expenses : [];
    d.version = 1;
    return d;
  }
  let db = freshDB();
  let store = null;          // seus dados reais (o que está salvo)
  let mode = 'loading';      // loading | cloud | local
  let demo = false;          // dados de exemplo em memória, nada é salvo
  let loadNote = '';
  let storageOk = true;
  let syncError = '';
  let cloud = null;
  const persisted = {};      // caminho do documento -> JSON salvo
  const queue = new Map();   // caminho -> corpo (null = apagar)
  let inflight = null, pumping = false;
  const SALES_CHUNK = 400;

  function docsOf(d) {
    const out = {};
    out['config/settings'] = { storeName: d.settings.storeName, onboarded: !!d.settings.onboarded, platforms: d.settings.platforms };
    d.products.forEach(p => { out['products/' + p.id] = p; });
    const groups = {};
    d.sales.forEach(s => { const k = (s.platform || 'outro') + '_' + (String(s.date || '').slice(0, 7) || 'sem-data'); (groups[k] = groups[k] || []).push(s); });
    Object.keys(groups).forEach(k => {
      const list = groups[k].slice().sort((a, b) => String(a.id).localeCompare(String(b.id)));
      for (let i = 0; i * SALES_CHUNK < list.length; i++) out['sales/' + k + '_' + i] = { items: list.slice(i * SALES_CHUNK, (i + 1) * SALES_CHUNK) };
    });
    const eg = {};
    d.expenses.forEach(e => { const k = String(e.date || '').slice(0, 4) || 'sem-data'; (eg[k] = eg[k] || []).push(e); });
    Object.keys(eg).forEach(k => { out['expenses/' + k] = { items: eg[k] }; });
    return out;
  }
  function buildFrom(map) {
    const d = freshDB();
    Object.keys(map).forEach(path => {
      let body; try { body = JSON.parse(map[path]); } catch (e) { return; }
      if (path === 'config/settings') {
        d.settings.storeName = body.storeName || d.settings.storeName;
        d.settings.onboarded = !!body.onboarded;
        PLATFORMS.forEach(p => { d.settings.platforms[p.id] = Object.assign({}, p.defaults, (body.platforms || {})[p.id] || {}); });
      } else if (path.startsWith('products/')) d.products.push(Object.assign(body, { id: path.slice(9) }));
      else if (path.startsWith('sales/')) (body.items || []).forEach(s => d.sales.push(s));
      else if (path.startsWith('expenses/')) (body.items || []).forEach(e => d.expenses.push(e));
    });
    d.products.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    return d;
  }
  const isPending = path => queue.has(path) || inflight === path;
  function enqueue(path, body) { queue.delete(path); queue.set(path, body); pump(); }
  async function writeDoc(path, body) {
    const run = () => body ? cloud.doc(path).set(body) : cloud.doc(path).delete();
    try { await run(); }
    catch (err) {
      const code = err && err.code;
      if (code === 'unavailable' || code === 'resource_exhausted') { await new Promise(r => setTimeout(r, 900 + Math.random() * 1200)); await run(); }
      else throw err;
    }
  }
  async function pump() {
    if (pumping) return; pumping = true; setSync();
    while (queue.size) {
      const [path, body] = queue.entries().next().value;
      queue.delete(path); inflight = path; setSync();
      try { await writeDoc(path, body); syncError = ''; }
      catch (err) {
        const code = err && err.code;
        syncError = code === 'quota_exceeded' ? 'Espaço de armazenamento cheio. Apague dados antigos ou exporte um backup.'
          : (code === 'revoked' || code === 'not_granted') ? 'Sem permissão para salvar nesta visualização.'
          : 'Não consegui salvar uma alteração. Verifique a conexão e tente de novo.';
        toast(syncError);
      }
      inflight = null;
    }
    pumping = false; setSync();
  }
  function save() {
    if (demo || mode === 'loading') return;
    if (mode === 'local') {
      try { localStorage.setItem(DB_KEY, JSON.stringify(db)); storageOk = true; }
      catch (e) { storageOk = false; toast('Não foi possível salvar neste navegador. Baixe um backup.'); }
      setSync(); return;
    }
    store = db;
    const next = docsOf(db);
    Object.keys(next).forEach(path => { const j = JSON.stringify(next[path]); if (persisted[path] !== j) { persisted[path] = j; enqueue(path, JSON.parse(j)); } });
    Object.keys(persisted).forEach(path => { if (!(path in next)) { delete persisted[path]; enqueue(path, null); } });
  }
  function setSync() {
    const el = document.getElementById('syncNote'); if (!el) return;
    let t, c = '';
    if (demo) { t = 'Modo exemplo: nada é salvo'; c = 'warn'; }
    else if (mode === 'loading') t = 'Carregando seus dados…';
    else if (mode === 'local') { t = storageOk ? 'Salvo só neste navegador' : 'Erro ao salvar'; c = storageOk ? '' : 'bad'; }
    else if (queue.size || inflight) t = 'Salvando…';
    else if (syncError) { t = 'Alteração não salva'; c = 'bad'; }
    else { t = 'Salvo na sua conta'; c = 'good'; }
    el.className = 'sync ' + c; el.textContent = t;
  }

  let renderQueued = false;

  function isEmptyDB(d) { return !d.products.length && !d.sales.length && !d.expenses.length; }
  function afterFirstLoad() {

  function startLocal() {

  function startCloud(ns) {

    const onErr = () => { clearTimeout(timer); loadNote = 'A conexão com seus dados foi interrompida. Abra o sistema de novo para continuar salvando.'; rerender(); };
    function apply() {
      if (Object.values(remote).some(v => v === undefined)) return;
      const docs = Object.assign({}, remote.settings ? { 'config/settings': remote.settings } : {}, remote.products, remote.sales, remote.expenses);
      let changed = first;
      Object.keys(persisted).forEach(p => { if (!isPending(p) && !(p in docs)) { delete persisted[p]; changed = true; } });
      Object.keys(docs).forEach(p => { if (!isPending(p) && persisted[p] !== docs[p]) { persisted[p] = docs[p]; changed = true; } });
      if (!changed) return;
      store = buildFrom(persisted);
      if (!demo) db = store;
      if (first) { first = false; clearTimeout(timer); loadNote = ''; afterFirstLoad(); }
      else if (!demo) scheduleRender();
    }
    cloud.doc('config/settings').onSnapshot(s => { remote.settings = s.exists ? JSON.stringify(s.data()) : null; apply(); }, onErr);
    ['products', 'sales', 'expenses'].forEach(c => {
      cloud.collection(c).onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { m[c + '/' + d.id] = JSON.stringify(d.data()); });
        remote[c] = m; apply();
      }, onErr);
    });
  }
  function enterDemo() { demo = true; db = buildSample(); setSync(); rerender(); }
  function exitDemo() {

  // ---------------------------------------------------------------- Utilidades
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const BRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const NUM = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
  const money = v => BRL.format(isFinite(v) ? v : 0);
  const money0 = v => BRL0.format(isFinite(v) ? v : 0);
  const moneyShort = v => {
    const a = Math.abs(v);
    if (a >= 1e6) return 'R$ ' + NUM.format(+(v / 1e6).toFixed(1)) + ' mi';
    if (a >= 1e4) return 'R$ ' + NUM.format(+(v / 1e3).toFixed(1)) + ' mil';
    return money0(v);
  };
  const pct = (v, d = 1) => isFinite(v) ? (v * 100).toFixed(d).replace('.', ',') + '%' : '—';
  const n2 = v => NUM.format(isFinite(v) ? v : 0);
  function parseNum(v) {
    if (typeof v === 'number') return v;
    if (v == null) return 0;
    let s = String(v).trim().replace(/[R$\s%]/g, '');
    if (!s) return 0;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }
  const fmtInput = v => (v == null || v === '' ? '' : String(+(+v).toFixed(4)).replace('.', ','));
  const pad = n => String(n).padStart(2, '0');

  const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoDate(d); };
  const fmtDate = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
  const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const cls = v => v > 0.0001 ? 'pos' : v < -0.0001 ? 'neg' : '';

  function toast(msg) {
    $$('.toast').forEach(x => x.remove());
    const t = document.createElement('div');

  // ---------------------------------------------------------------- Cálculos
  function prodCalc(p) {
    const price = +p.price || 0, cost = +p.cost || 0;
    const taxV = price * (+p.tax || 0) / 100;
    const commV = price * (+p.commission || 0) / 100;
    const fixed = +p.fixedFee || 0, ship = +p.shipping || 0, pack = +p.packaging || 0, other = +p.otherCosts || 0;
    const totalCost = cost + taxV + commV + fixed + ship + pack + other;
    const profit = price - totalCost;
    const varPct = ((+p.tax || 0) + (+p.commission || 0)) / 100;
    const fixedCosts = cost + fixed + ship + pack + other;
    const invested = cost + pack + other;
    const priceFor = m => (1 - varPct - m) > 0 ? fixedCosts / (1 - varPct - m) : NaN;
    return {
      price, cost, taxV, commV, fixed, ship, pack, other, totalCost, profit,
      margin: price ? profit / price : 0,
      markup: cost ? (price - cost) / cost : 0,
      multiplier: cost ? price / cost : 0,
      roi: invested ? profit / invested : 0,
      breakEven: priceFor(0),
      priceFor,
      stockValue: cost * (+p.stock || 0),
      stockRevenue: price * (+p.stock || 0),
      stockProfit: profit * (+p.stock || 0),
    };
  }
  function saleCalc(s) {
    const st = SALE_STATUS[s.status] || SALE_STATUS.entregue;
    const qty = +s.qty || 0;
    const gross = (+s.unitPrice || 0) * qty;
    const discount = +s.discount || 0;
    const revenue = Math.max(0, gross - discount);
    const cogs = (+s.unitCost || 0) * qty;
    const packOther = ((+s.packaging || 0) + (+s.otherCosts || 0)) * qty;
    const taxV = revenue * (+s.tax || 0) / 100;
    const commV = revenue * (+s.commission || 0) / 100;
    const fixed = (+s.fixedFee || 0) * qty;
    const ship = +s.shipping || 0;
    if (!st.counts) {
      // Cancelada: não conta. Devolvida: só o frete pago vira prejuízo.
      const loss = s.status === 'devolvida' ? ship : 0;
      return { counts: false, qty: 0, gross: 0, discount: 0, revenue: 0, cogs: 0, packOther: 0, taxV: 0, commV: 0, fixed: 0, ship: loss, fees: 0, totalCost: loss, profit: -loss, margin: 0 };
    }
    const totalCost = cogs + packOther + taxV + commV + fixed + ship;
    const profit = revenue - totalCost;
    return { counts: true, qty, gross, discount, revenue, cogs, packOther, taxV, commV, fixed, ship, fees: commV + fixed, totalCost, profit, margin: revenue ? profit / revenue : 0 };
  }
  function aggregate(sales, expenses) {
    const a = { orders: 0, units: 0, revenue: 0, discount: 0, cogs: 0, packOther: 0, taxV: 0, commV: 0, fixed: 0, ship: 0, profit: 0, expenses: 0, cancelled: 0, returned: 0 };
    sales.forEach(s => {
      const c = saleCalc(s);
      if (s.status === 'cancelada') a.cancelled++;
      if (s.status === 'devolvida') a.returned++;
      if (c.counts) { a.orders++; a.units += c.qty; }
      a.revenue += c.revenue; a.discount += c.discount; a.cogs += c.cogs; a.packOther += c.packOther;
      a.taxV += c.taxV; a.commV += c.commV; a.fixed += c.fixed; a.ship += c.ship; a.profit += c.profit;
    });
    (expenses || []).forEach(e => { a.expenses += +e.amount || 0; });
    a.net = a.profit - a.expenses;
    a.margin = a.revenue ? a.profit / a.revenue : 0;
    a.netMargin = a.revenue ? a.net / a.revenue : 0;
    a.ticket = a.orders ? a.revenue / a.orders : 0;
    a.invested = a.cogs + a.packOther;
    a.roi = a.invested ? a.net / a.invested : 0;
    return a;
  }

  // ---------------------------------------------------------------- Período
  const PERIODS = [
    ['mes', 'Este mês'], ['mespassado', 'Mês passado'], ['30', '30 dias'], ['90', '90 dias'], ['ano', 'Este ano'], ['tudo', 'Tudo'], ['custom', 'Personalizado'],
  ];
  let period = { key: 'mes', from: '', to: '' };
  try { const p = JSON.parse(localStorage.getItem('cv_period') || 'null'); if (p && p.key) period = p; } catch (e) { /* sem storage */ }
  function savePeriod() { try { localStorage.setItem('cv_period', JSON.stringify(period)); } catch (e) { /* ok */ } }
  function getRange() {
    const t = todayStr(); const d = new Date();
    switch (period.key) {
      case 'mes': return { from: t.slice(0, 8) + '01', to: t };
      case 'mespassado': {
        const f = new Date(d.getFullYear(), d.getMonth() - 1, 1), l = new Date(d.getFullYear(), d.getMonth(), 0);
        return { from: isoDate(f), to: isoDate(l) };
      }
      case '30': return { from: addDays(t, -29), to: t };
      case '90': return { from: addDays(t, -89), to: t };
      case 'ano': return { from: t.slice(0, 4) + '-01-01', to: t };
      case 'custom': return { from: period.from || addDays(t, -29), to: period.to || t };
      default: {
        const dates = db.sales.map(s => s.date).concat(db.expenses.map(e => e.date)).filter(Boolean).sort();
        return { from: dates[0] || addDays(t, -29), to: dates.length && dates[dates.length - 1] > t ? dates[dates.length - 1] : t };
      }
    }
  }
  const inRange = (s, r) => s && s >= r.from && s <= r.to;
  function previousRange(r) {
    const days = Math.round((parseISO(r.to) - parseISO(r.from)) / 864e5) + 1;
    return { from: addDays(r.from, -days), to: addDays(r.from, -1) };
  }
  function buckets(r) {
    const days = Math.round((parseISO(r.to) - parseISO(r.from)) / 864e5) + 1;
    const out = [];
    if (days <= 62) {
      for (let s = r.from; s <= r.to; s = addDays(s, 1)) out.push({ key: s, label: s.slice(8, 10) + '/' + s.slice(5, 7) });
      return { mode: 'day', list: out, keyOf: s => s };
    }
    let y = +r.from.slice(0, 4), m = +r.from.slice(5, 7);
    const ey = +r.to.slice(0, 4), em = +r.to.slice(5, 7);
    while (y < ey || (y === ey && m <= em)) {
      out.push({ key: y + '-' + pad(m), label: MONTHS[m - 1] + '/' + String(y).slice(2) });
      m++; if (m > 12) { m = 1; y++; }

  }
  function periodLabel() {

  }

  const hasChart = typeof window.Chart !== 'undefined';

            else { ctx.textAlign = 'center'; ctx.textBaseline = v >= 0 ? 'bottom' : 'top'; ctx.fillText(txt, el.x, el.y + (v >= 0 ? -4 : 4)); }
            ctx.restore();

  }
  function mkChart(id, cfg) {
    const el = document.getElementById(id);
    if (hasChart) { Chart.defaults.color = cv('--text-2'); Chart.defaults.borderColor = cv('--grid'); Chart.defaults.plugins.tooltip.backgroundColor = cv('--tooltip'); }

  }
  const moneyTick = v => moneyShort(v);
  const tooltipMoney = { callbacks: { label: c => ' ' + (c.dataset.label ? c.dataset.label + ': ' : '') + money(c.parsed[c.chart.options.indexAxis === 'y' ? 'x' : 'y']) } };
  function barDefaults(extra) {
    return Object.assign({ borderRadius: 4, borderSkipped: 'start', maxBarThickness: 34, borderWidth: 0 }, extra || {});
  }
  function scalesMoney(horizontal) {
    const val = { grid: { color: cv('--grid') }, border: { display: false }, ticks: { callback: moneyTick, maxTicksLimit: horizontal ? 5 : 6, maxRotation: 0 } };
    const cat = { grid: { display: false }, border: { color: cv('--axis') }, ticks: { autoSkip: true, maxRotation: 0 } };
    return horizontal ? { x: val, y: cat } : { x: cat, y: val };
  }
  function legendHTML(items) {
    return '<div class="legend">' + items.map(i => `<span><i style="background:${i.color}"></i>${esc(i.label)}</span>`).join('') + '</div>';
  }

  // ---------------------------------------------------------------- Navegação
  function renderNav() {
    const h = location.hash || '#inicio';
    const item = (href, inner, active) => `<a href="${href}" class="${active ? 'active' : ''}">${inner}</a>`;
    let html = '';
    html += item('#inicio', '<span class="ico">▦</span>Visão geral', h === '#inicio' || h === '#' || h === '');
    html += '<div class="nav-label">Plataformas</div>';
    PLATFORMS.forEach(p => {
      html += item('#' + p.id, `<span class="dot" style="background:${p.color}"></span>${p.name}`, h === '#' + p.id || h.startsWith('#' + p.id + '-'));
    });
    html += '<div class="nav-label">Ferramentas</div>';
    html += item('#produtos', '<span class="ico">▤</span>Todos os produtos', h === '#produtos');
    html += item('#despesas', '<span class="ico">⊖</span>Despesas gerais', h === '#despesas');
    html += item('#calculadora', '<span class="ico">∑</span>Calculadora de preço', h === '#calculadora');
    html += item('#config', '<span class="ico">⚙</span>Configurações', h === '#config');
    $('#nav').innerHTML = html;
    $('#storeName').textContent = db.settings.storeName || 'Minha Loja';
  }

  function renderBanner() {
    const el = $('#banner'); if (!el) return;
    let h = '';
    if (demo) h += `<div class="banner warn"><div><b>Você está vendo dados de exemplo.</b> Nada do que você fizer aqui é salvo. Quando quiser usar de verdade, comece com seus dados.</div><button class="btn primary" data-act="exit-demo">Começar com meus dados</button></div>`;
    if (loadNote) h += `<div class="banner bad"><div>${esc(loadNote)}</div></div>`;
    if (mode === 'local' && !demo) h += `<div class="banner"><div>Seus dados estão sendo salvos só neste navegador. Baixe um backup em Configurações de vez em quando.</div></div>`;
    el.innerHTML = h;
  }
  function loadingHTML() {
    return `<div class="topbar"><div class="page-title"><div><h1>Visão geral</h1><div class="sub">Carregando seus produtos, vendas e despesas…</div></div></div></div>
      <div class="kpis">${'<div class="kpi skel"><div class="k-label">&nbsp;</div><div class="k-value">&nbsp;</div><div class="k-foot">&nbsp;</div></div>'.repeat(6)}</div>
      <div class="grid g3"><div class="card skel" style="height:320px"></div><div class="card skel" style="height:320px"></div></div>`;
  }

  function route() {
    destroyCharts();
    renderNav();
    $('#sidebar').classList.remove('open');
    const hv = (location.hash || '').replace(/^#/, '');
    const dash = hv.indexOf('-');
    const parts = PMAP[hv.split('-')[0]] ? ['p', hv.split('-')[0], dash > 0 ? hv.slice(dash + 1) : 'resumo'] : [hv];
    const view = $('#view');
    document.documentElement.style.removeProperty('--pc');
    document.documentElement.style.removeProperty('--pc-ink');
    renderBanner();
    if (mode === 'loading') { view.innerHTML = loadingHTML(); renderNav(); return; }
    let title = 'Visão geral';
    if (parts[0] === 'p' && PMAP[parts[1]]) {
      const p = PMAP[parts[1]];
      document.documentElement.style.setProperty('--pc', p.color);
      document.documentElement.style.setProperty('--pc-ink', 'var(--ink-' + p.id + ')');
      title = p.name;
      renderPlatform(view, p, parts[2] || 'resumo');
    } else if (parts[0] === 'produtos') { title = 'Todos os produtos'; renderAllProducts(view); }
    else if (parts[0] === 'despesas') { title = 'Despesas gerais'; renderGeneralExpenses(view); }
    else if (parts[0] === 'calculadora') { title = 'Calculadora'; renderCalc(view); }
    else if (parts[0] === 'config') { title = 'Configurações'; renderConfig(view); }
    else renderDashboard(view);
    $('#mobileTitle').textContent = title;
    window.scrollTo(0, 0);
  }
  function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }

  function periodControl() {
    const r = getRange();
    let h = '<div class="seg" role="group" aria-label="Período">';
    PERIODS.forEach(([k, l]) => { h += `<button data-act="period" data-k="${k}" class="${period.key === k ? 'on' : ''}">${l}</button>`; });
    h += '</div>';
    if (period.key === 'custom') {
      h += `<input type="date" id="pFrom" value="${r.from}" style="width:auto"> <span class="muted">até</span> <input type="date" id="pTo" value="${r.to}" style="width:auto">`;
    }
    return '<div class="toolbar">' + h + '</div>';
  }

  // ---------------------------------------------------------------- KPIs
  function deltaFoot(cur, prev, isMoney) {
    if (!prev) return '<span class="muted">sem período anterior</span>';
    const d = (cur - prev) / Math.abs(prev);
    const arrow = d >= 0 ? '▲' : '▼';
    return `<span class="${d >= 0 ? 'pos' : 'neg'}">${arrow} ${pct(Math.abs(d))}</span> vs período anterior`;
  }
  function kpiBlock(a, prev) {
    const k = (label, value, foot, extra) => `<div class="kpi ${extra || ''}"><div class="k-label">${label}</div><div class="k-value num">${value}</div><div class="k-foot">${foot || ''}</div></div>`;
    return '<div class="kpis">' +
      k('Faturamento', money(a.revenue), deltaFoot(a.revenue, prev && prev.revenue), 'hl') +
      k('Lucro das vendas', `<span class="${cls(a.profit)}">${money(a.profit)}</span>`, 'margem ' + pct(a.margin)) +
      k('Despesas', money(a.expenses), 'ADS, mensalidades, etc.') +
      k('Lucro líquido', `<span class="${cls(a.net)}">${money(a.net)}</span>`, 'margem líquida ' + pct(a.netMargin), 'hl') +
      k('Pedidos', n2(a.orders), n2(a.units) + ' unidades' + (a.cancelled || a.returned ? ` · ${a.cancelled} canc. · ${a.returned} dev.` : '')) +
      k('Ticket médio', money(a.ticket), 'por pedido') +
      k('Impostos', money(a.taxV), a.revenue ? pct(a.taxV / a.revenue) + ' do faturamento' : '') +
      k('Comissões e taxas', money(a.commV + a.fixed), a.revenue ? pct((a.commV + a.fixed) / a.revenue) + ' do faturamento' : '') +
      k('Frete pago', money(a.ship), a.revenue ? pct(a.ship / a.revenue) + ' do faturamento' : '') +
      k('Custo dos produtos', money(a.cogs + a.packOther), 'produto + embalagem + outros') +
      k('ROI', `<span class="${cls(a.roi)}">${pct(a.roi)}</span>`, 'lucro líquido ÷ custo investido') +
      '</div>';
  }

  // Para onde vai o dinheiro (lista de barras rotuladas)
  function moneyFlowHTML(a) {
    if (!a.revenue) return '<div class="empty small">Sem vendas no período.</div>';
    const rows = [
      ['Custo dos produtos', a.cogs], ['Embalagem e outros', a.packOther], ['Impostos', a.taxV], ['Comissões', a.commV],
      ['Taxas fixas', a.fixed], ['Frete', a.ship], ['Despesas (ADS etc.)', a.expenses],
    ];
    const max = Math.max(...rows.map(r => r[1]), Math.abs(a.net), 1);
    let h = `<div class="small muted" style="margin-bottom:10px">De cada <b>R$ 100,00</b> vendidos:</div>`;
    rows.forEach(([l, v]) => {
      const share = v / a.revenue * 100;
      h += `<div style="margin-bottom:8px"><div class="row small" style="justify-content:space-between"><span>${l}</span><span class="num"><b>${money(share)}</b> <span class="muted">· ${money(v)}</span></span></div>
        <div style="height:8px;background:var(--surface-2);border-radius:4px;margin-top:3px"><div style="height:100%;width:${Math.max(0.5, v / max * 100)}%;background:var(--bar);border-radius:4px"></div></div></div>`;
    });
    const share = a.net / a.revenue * 100;
    h += `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)"><div class="row" style="justify-content:space-between"><b>Sobra para você (lucro líquido)</b><span class="num ${cls(a.net)}"><b>${money(share)}</b> · ${money(a.net)}</span></div>
      <div style="height:10px;background:var(--surface-2);border-radius:5px;margin-top:4px"><div style="height:100%;width:${Math.max(0.5, Math.abs(a.net) / max * 100)}%;background:${a.net >= 0 ? 'var(--good)' : 'var(--bad)'};border-radius:5px"></div></div></div>`;
    return h;
  }

  function alertsHTML(pid) {
    const prods = pid ? productsOf(pid) : db.products;
    const items = [];
    prods.forEach(p => {
      if (p.status === 'pausado') return;
      const c = prodCalc(p); const pl = PMAP[p.platform];
      const tag = pid ? '' : ` <span class="muted">(${pl.name})</span>`;
      if (c.profit < 0) items.push(['bad', '!', `<b>${esc(p.name)}</b>${tag} dá <b>prejuízo</b> de ${money(-c.profit)} por unidade. Preço mínimo: ${money(c.breakEven)}.`]);
      else if (c.margin < 0.08) items.push(['warn', '!', `<b>${esc(p.name)}</b>${tag} tem margem baixa (${pct(c.margin)}). Para 15% de margem, venda por ${money(c.priceFor(0.15))}.`]);
      const st = +p.stock || 0, min = +p.minStock || 0;
      if (st <= 0) items.push(['bad', '▣', `<b>${esc(p.name)}</b>${tag} está <b>sem estoque</b>.`]);
      else if (min && st <= min) items.push(['warn', '▣', `<b>${esc(p.name)}</b>${tag} com estoque baixo: ${st} un. (mínimo ${min}).`]);
    });
    if (!items.length) return prods.length ? '<div class="alert good"><span class="a-ico">✓</span>Tudo certo: nenhum produto com prejuízo ou estoque baixo.</div>' : '<div class="muted small">Cadastre produtos para ver alertas.</div>';
    items.sort((a, b) => (a[0] === 'bad' ? 0 : 1) - (b[0] === 'bad' ? 0 : 1));
    return '<div class="alerts">' + items.slice(0, 12).map(i => `<div class="alert ${i[0]}"><span class="a-ico">${i[1]}</span><div>${i[2]}</div></div>`).join('') +
      (items.length > 12 ? `<div class="muted small">+ ${items.length - 12} alertas</div>` : '') + '</div>';
  }

  function timeSeries(sales, r) {
    const b = buckets(r);
    const idx = Object.fromEntries(b.list.map((x, i) => [x.key, i]));
    const rev = b.list.map(() => 0), prof = b.list.map(() => 0), orders = b.list.map(() => 0);
    sales.forEach(s => {
      const i = idx[b.keyOf(s.date)]; if (i == null) return;
      const c = saleCalc(s); rev[i] += c.revenue; prof[i] += c.profit; if (c.counts) orders[i]++;
    });
    return { b, rev, prof, orders };
  }

  // ---------------------------------------------------------------- Dashboard
  function renderDashboard(view) {
    const r = getRange(), pr = previousRange(r);
    const sales = salesOf(null, r);
    const a = aggregate(sales, expensesOf(null, r));
    const prev = aggregate(salesOf(null, pr), expensesOf(null, pr));
    const perPlat = PLATFORMS.map(p => ({ p, a: aggregate(salesOf(p.id, r), expensesOf(p.id, r)) }));
    const generalExp = expensesOf('geral', r).reduce((s, e) => s + (+e.amount || 0), 0);
    const empty = !db.products.length && !db.sales.length;

    let h = `<div class="topbar"><div class="page-title"><div><h1>Visão geral</h1><div class="sub">${periodLabel()}</div></div></div>${periodControl()}</div>`;
    if (empty) {
      h += `<div class="card mt" style="margin-bottom:16px"><div class="empty"><div class="big">🛒</div><h2 style="margin:0">Bem-vindo ao seu controle de vendas</h2>
        <p>Comece cadastrando seus produtos em cada plataforma, ou carregue dados de exemplo para ver como tudo funciona.</p>
        <div class="row" style="justify-content:center">${PLATFORMS.map(p => `<a class="btn" href="#${p.id}-produtos"><span class="pill"><span class="pdot" style="background:${p.color}"></span>${p.name}</span></a>`).join('')}</div>
        <div class="mt row" style="justify-content:center"><button class="btn primary" data-act="sample">Ver com dados de exemplo</button><a class="btn" href="#config">Restaurar um backup</a></div></div></div>`;
    }
    h += kpiBlock(a, prev);
    h += `<div class="grid g3">
      <div class="card"><h3>Faturamento e lucro</h3><div class="card-sub">${r.from === r.to ? '' : 'Por ' + (buckets(r).mode === 'day' ? 'dia' : 'mês')}, todas as plataformas</div>
        ${legendHTML([{ label: 'Faturamento', color: NEUTRAL_A }, { label: 'Lucro das vendas', color: NEUTRAL_B }])}<div class="chart-box"><canvas id="chTime"></canvas></div></div>
      <div class="card"><h3>Faturamento por plataforma</h3><div class="card-sub">Participação no período</div><div class="chart-box"><canvas id="chPlatRev"></canvas></div></div>
    </div>`;
    h += `<div class="grid g2">
      <div class="card"><h3>Evolução por plataforma</h3><div class="card-sub">Faturamento</div>${legendHTML(PLATFORMS.map(p => ({ label: p.name, color: p.color })))}<div class="chart-box"><canvas id="chPlatLine"></canvas></div></div>
      <div class="card"><h3>Lucro líquido por plataforma</h3><div class="card-sub">Lucro das vendas − despesas da plataforma</div><div class="chart-box"><canvas id="chPlatProfit"></canvas></div></div>
    </div>`;
    h += `<div class="card" style="margin-bottom:16px"><h3>Comparativo entre plataformas</h3><div class="card-sub">${periodLabel()}</div><div class="table-wrap" style="box-shadow:none">
      <table><thead><tr><th>Plataforma</th><th class="r">Pedidos</th><th class="r">Unid.</th><th class="r">Faturamento</th><th class="r">Ticket médio</th><th class="r">Impostos</th><th class="r">Comissões/taxas</th><th class="r">Frete</th><th class="r">Custo produtos</th><th class="r">Lucro vendas</th><th class="r">Margem</th><th class="r">Despesas</th><th class="r">Lucro líquido</th></tr></thead><tbody>
      ${perPlat.map(({ p, a: x }) => `<tr><td><a href="#${p.id}" style="text-decoration:none;color:inherit"><span class="pill"><span class="pdot" style="background:${p.color}"></span>${p.name}</span></a></td>
        <td class="r num">${x.orders}</td><td class="r num">${x.units}</td><td class="r num">${money(x.revenue)}</td><td class="r num">${money(x.ticket)}</td><td class="r num">${money(x.taxV)}</td><td class="r num">${money(x.commV + x.fixed)}</td><td class="r num">${money(x.ship)}</td><td class="r num">${money(x.cogs + x.packOther)}</td>
        <td class="r num ${cls(x.profit)}">${money(x.profit)}</td><td class="r num">${pct(x.margin)}</td><td class="r num">${money(x.expenses)}</td><td class="r num ${cls(x.net)}"><b>${money(x.net)}</b></td></tr>`).join('')}
      ${generalExp ? `<tr><td class="muted">Despesas gerais</td><td colspan="10"></td><td class="r num">${money(generalExp)}</td><td class="r num neg">${money(-generalExp)}</td></tr>` : ''}
      </tbody><tfoot><tr><td>Total</td><td class="r num">${a.orders}</td><td class="r num">${a.units}</td><td class="r num">${money(a.revenue)}</td><td class="r num">${money(a.ticket)}</td><td class="r num">${money(a.taxV)}</td><td class="r num">${money(a.commV + a.fixed)}</td><td class="r num">${money(a.ship)}</td><td class="r num">${money(a.cogs + a.packOther)}</td><td class="r num ${cls(a.profit)}">${money(a.profit)}</td><td class="r num">${pct(a.margin)}</td><td class="r num">${money(a.expenses)}</td><td class="r num ${cls(a.net)}">${money(a.net)}</td></tr></tfoot></table></div></div>`;
    h += `<div class="grid g2">
      <div class="card"><h3>Top 10 produtos por lucro</h3><div class="card-sub">Cor = plataforma</div>${legendHTML(PLATFORMS.map(p => ({ label: p.name, color: p.color })))}<div class="chart-box tall"><canvas id="chTop"></canvas></div></div>
      <div class="card"><h3>Para onde vai o dinheiro</h3><div class="card-sub">Composição do faturamento no período</div>${moneyFlowHTML(a)}</div>
    </div>`;
    h += `<div class="grid g2">
      <div class="card"><h3>Alertas</h3><div class="card-sub">Prejuízo, margem baixa e estoque</div>${alertsHTML(null)}</div>
      <div class="card"><h3>Estoque</h3><div class="card-sub">Valor parado em mercadoria</div>${stockSummaryHTML(db.products)}</div>
    </div>`;
    view.innerHTML = h;

    // Charts
    const ts = timeSeries(sales, r);
    mkChart('chTime', { type: 'bar', data: { labels: ts.b.list.map(x => x.label), datasets: [
      Object.assign({ label: 'Faturamento', data: ts.rev, backgroundColor: cv('--neutral-a') }, barDefaults()),
      Object.assign({ label: 'Lucro das vendas', data: ts.prof, backgroundColor: cv('--neutral-b') }, barDefaults()),
    ] }, options: { scales: scalesMoney(false), plugins: { tooltip: Object.assign({ mode: 'index', intersect: false }, tooltipMoney) }, datasets: { bar: { categoryPercentage: 0.75, barPercentage: 0.9 } } } });

    const totalRev = perPlat.reduce((s, x) => s + x.a.revenue, 0);
    mkChart('chPlatRev', { type: 'bar', data: { labels: PLATFORMS.map(p => p.name), datasets: [Object.assign({ label: 'Faturamento', data: perPlat.map(x => x.a.revenue), backgroundColor: PLATFORMS.map(p => pc(p)) }, barDefaults({ maxBarThickness: 28 }))] },
      options: { indexAxis: 'y', layout: { padding: { right: 90 } }, scales: scalesMoney(true), plugins: { tooltip: tooltipMoney, valueLabels: { enabled: true, format: v => moneyShort(v) + (totalRev ? ' · ' + pct(v / totalRev, 0) : '') } } } });

    const lines = PLATFORMS.map(p => {
      const t = timeSeries(salesOf(p.id, r), r);
      return { label: p.name, data: t.rev, borderColor: pc(p), backgroundColor: pc(p), borderWidth: 2, pointRadius: t.rev.length > 40 ? 0 : 3, pointHoverRadius: 5, tension: 0.25 };
    });
    mkChart('chPlatLine', { type: 'line', data: { labels: ts.b.list.map(x => x.label), datasets: lines },
      options: { interaction: { mode: 'index', intersect: false }, scales: scalesMoney(false), plugins: { tooltip: tooltipMoney } } });

    mkChart('chPlatProfit', { type: 'bar', data: { labels: PLATFORMS.map(p => p.name), datasets: [Object.assign({ label: 'Lucro líquido', data: perPlat.map(x => x.a.net), backgroundColor: PLATFORMS.map(p => pc(p)) }, barDefaults({ maxBarThickness: 48 }))] },
      options: { layout: { padding: { top: 20 } }, scales: scalesMoney(false), plugins: { tooltip: tooltipMoney, valueLabels: { enabled: true, format: v => moneyShort(v) } } } });

    topProductsChart('chTop', sales, null);
  }

  function stockSummaryHTML(prods) {
    if (!prods.length) return '<div class="muted small">Sem produtos.</div>';
    let units = 0, val = 0, rev = 0, prof = 0;
    prods.forEach(p => { const c = prodCalc(p); units += +p.stock || 0; val += c.stockValue; rev += c.stockRevenue; prof += c.stockProfit; });
    const row = (l, v, c) => `<div class="pv-row"><span class="lbl">${l}</span><b class="num ${c || ''}">${v}</b></div>`;
    return row('Unidades em estoque', n2(units)) + row('Valor em custo', money(val)) + row('Se vender tudo, fatura', money(rev)) + row('Lucro potencial do estoque', money(prof), cls(prof)) +
      `<div class="pv-row"><span class="lbl">Produtos cadastrados</span><b>${prods.length} (${prods.filter(p => p.status !== 'pausado').length} ativos)</b></div>`;
  }

  function topProductsChart(canvasId, sales, pid) {
    const map = {};
    sales.forEach(s => {
      const c = saleCalc(s); const key = s.productId || s.productName;
      if (!map[key]) map[key] = { name: s.productName || (productById(s.productId) || {}).name || 'Produto', platform: s.platform, profit: 0, revenue: 0, units: 0 };
      map[key].profit += c.profit; map[key].revenue += c.revenue; map[key].units += c.qty;
    });
    const list = Object.values(map).sort((a, b) => b.profit - a.profit).slice(0, 10);
    const el = document.getElementById(canvasId);
    if (!list.length) { if (el) el.parentElement.innerHTML = '<div class="empty small">Sem vendas no período.</div>'; return; }
    const trunc = s => s.length > 26 ? s.slice(0, 25) + '…' : s;
    mkChart(canvasId, { type: 'bar', data: { labels: list.map(x => trunc(x.name)), datasets: [Object.assign({ label: 'Lucro', data: list.map(x => x.profit), backgroundColor: list.map(x => pc(PMAP[x.platform])) }, barDefaults({ maxBarThickness: 22 }))] },
      options: { indexAxis: 'y', layout: { padding: { right: 70 } }, scales: scalesMoney(true), plugins: {
        tooltip: { callbacks: { title: c => list[c[0].dataIndex].name + (pid ? '' : ' · ' + PMAP[list[c[0].dataIndex].platform].name), label: c => { const x = list[c.dataIndex]; return [' Lucro: ' + money(x.profit), ' Faturamento: ' + money(x.revenue), ' Unidades: ' + x.units]; } } },
        valueLabels: { enabled: true, format: v => moneyShort(v) } } } });
  }

  // ---------------------------------------------------------------- Plataforma
  const TABS = [['resumo', 'Resumo'], ['produtos', 'Produtos'], ['vendas', 'Vendas'], ['despesas', 'Despesas'], ['config', 'Taxas e configurações']];
  function renderPlatform(view, p, tab) {
    const prods = productsOf(p.id);
    let h = `<div class="topbar"><div class="page-title"><div class="plat-badge">${p.short}</div><div><h1>${p.name}</h1><div class="sub">${prods.length} produtos · ${tab === 'resumo' || tab === 'vendas' || tab === 'despesas' ? periodLabel() : 'cadastro'}</div></div></div>
      <div class="toolbar"><button class="btn" data-act="new-product" data-pid="${p.id}">+ Produto</button><button class="btn plat" data-act="new-sale" data-pid="${p.id}">+ Registrar venda</button></div></div>`;
    h += '<div class="tabs">' + TABS.map(([k, l]) => `<a href="#${k === 'resumo' ? p.id : p.id + '-' + k}" class="${tab === k ? 'on' : ''}">${l}</a>`).join('') + '</div>';
    view.innerHTML = h + '<div id="tabBody"></div>';
    const body = $('#tabBody');
    if (tab === 'produtos') renderProductsTab(body, p);
    else if (tab === 'vendas') renderSalesTab(body, p);
    else if (tab === 'despesas') renderExpensesTab(body, p.id);
    else if (tab === 'config') renderPlatformConfig(body, p);
    else renderPlatformSummary(body, p);
  }

  function renderPlatformSummary(body, p) {
    const r = getRange(), pr = previousRange(r);
    const sales = salesOf(p.id, r);
    const a = aggregate(sales, expensesOf(p.id, r));
    const prev = aggregate(salesOf(p.id, pr), expensesOf(p.id, pr));

  // ---------------------------------------------------------------- Tabela de produtos
  const ui = { sort: {}, q: {}, status: {} };
  function sortList(list, tableKey, getters) {
    const s = ui.sort[tableKey]; if (!s || !getters[s.key]) return list;
    const g = getters[s.key];
    return list.slice().sort((a, b) => { const x = g(a), y = g(b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * (s.dir === 'asc' ? 1 : -1); });
  }
  function th(tableKey, key, label, right) {
    const s = ui.sort[tableKey]; const arrow = s && s.key === key ? (s.dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="sortable ${right ? 'r' : ''}" data-act="sort" data-t="${tableKey}" data-k="${key}">${label}${arrow}</th>`;
  }

  function renderProductsTab(body, p) {
    body.innerHTML = `<div class="row" style="margin-bottom:12px"><input type="text" class="search" placeholder="Buscar produto, SKU, categoria…" data-act="search" data-t="prod-${p.id}" value="${esc(ui.q['prod-' + p.id] || '')}">
      <span class="spacer"></span><span class="muted small">Vendidos e lucro referem-se a: ${periodLabel()}</span></div><div id="tblWrap"></div>
      <details class="help mt"><summary>Como os valores são calculados?</summary><p><b>Custo total</b> = custo do produto + imposto + comissão + taxa fixa + frete + embalagem + outros. <b>Lucro/un.</b> = preço de venda − custo total. <b>Margem</b> = lucro ÷ preço de venda. <b>Markup</b> = (preço − custo do produto) ÷ custo do produto. <b>ROI</b> = lucro ÷ (custo + embalagem + outros). <b>Preço mínimo</b> = preço em que o lucro é zero.</p></details>`;

  function renderProductsTable(pid) {
    const tKey = pid ? 'prod-' + pid : 'prod-all';
    const q = (ui.q[tKey] || '').toLowerCase();
    const r = getRange();
    const soldMap = {};
    db.sales.filter(s => inRange(s.date, r)).forEach(s => { const c = saleCalc(s); const m = soldMap[s.productId] || (soldMap[s.productId] = { units: 0, profit: 0 }); m.units += c.qty; m.profit += c.profit; });
    let list = (pid ? productsOf(pid) : db.products.slice()).filter(x => !q || [x.name, x.sku, x.category, x.supplier].join(' ').toLowerCase().includes(q));
    const rows = list.map(x => ({ x, c: prodCalc(x), sold: soldMap[x.id] || { units: 0, profit: 0 } }));
    const sorted = sortList(rows, tKey, {
      name: o => o.x.name || '', stock: o => +o.x.stock || 0, cost: o => o.c.cost, price: o => o.c.price, profit: o => o.c.profit, margin: o => o.c.margin,
      markup: o => o.c.markup, roi: o => o.c.roi, sold: o => o.sold.units, sprofit: o => o.sold.profit, total: o => o.c.totalCost, platform: o => o.x.platform,
    });
    const wrap = $('#tblWrap');
    if (!list.length) {
      wrap.innerHTML = `<div class="card"><div class="empty"><div class="big">📦</div><p>${q ? 'Nenhum produto encontrado.' : 'Nenhum produto cadastrado ainda.'}</p>${pid ? `<button class="btn plat" data-act="new-product" data-pid="${pid}">+ Cadastrar primeiro produto</button>` : ''}</div></div>`;
      return;
    }
    let tot = { stockVal: 0, units: 0, sold: 0, sprofit: 0, potential: 0 };
    let h = `<div class="table-wrap"><table><thead><tr>${th(tKey, 'name', 'Produto')}${pid ? '' : th(tKey, 'platform', 'Plataforma')}<th>Status</th>${th(tKey, 'stock', 'Estoque', 1)}${th(tKey, 'cost', 'Custo', 1)}${th(tKey, 'price', 'Preço venda', 1)}<th class="r">Imposto</th><th class="r">Comissão + taxa</th><th class="r">Frete</th><th class="r">Emb. + outros</th>${th(tKey, 'total', 'Custo total', 1)}${th(tKey, 'profit', 'Lucro/un.', 1)}${th(tKey, 'margin', 'Margem', 1)}${th(tKey, 'markup', 'Markup', 1)}${th(tKey, 'roi', 'ROI', 1)}<th class="r">Preço mín.</th>${th(tKey, 'sold', 'Vendidos', 1)}${th(tKey, 'sprofit', 'Lucro período', 1)}<th></th></tr></thead><tbody>`;
    sorted.forEach(({ x, c, sold }) => {
      const st = +x.stock || 0, min = +x.minStock || 0;
      const stPill = x.status === 'pausado' ? '<span class="pill">Pausado</span>' : st <= 0 ? '<span class="pill bad">Sem estoque</span>' : (min && st <= min) ? '<span class="pill warn">Estoque baixo</span>' : '<span class="pill good">Ativo</span>';
      tot.stockVal += c.stockValue; tot.units += st; tot.sold += sold.units; tot.sprofit += sold.profit; tot.potential += c.stockProfit;
      const pl = PMAP[x.platform];
      h += `<tr><td><span class="prod-name" title="${esc(x.name)}">${esc(x.name)}</span><span class="prod-sku">${esc([x.sku, x.category].filter(Boolean).join(' · ') || '—')}</span></td>
        ${pid ? '' : `<td><span class="pill"><span class="pdot" style="background:${pl.color}"></span>${pl.name}</span></td>`}
        <td>${stPill}</td><td class="r num">${n2(st)}</td><td class="r num">${money(c.cost)}</td><td class="r num"><b>${money(c.price)}</b></td>
        <td class="r num">${money(c.taxV)}<div class="prod-sku">${n2(x.tax)}%</div></td><td class="r num">${money(c.commV + c.fixed)}<div class="prod-sku">${n2(x.commission)}% + ${money(c.fixed)}</div></td>
        <td class="r num">${money(c.ship)}</td><td class="r num">${money(c.pack + c.other)}</td><td class="r num">${money(c.totalCost)}</td>
        <td class="r num ${cls(c.profit)}"><b>${money(c.profit)}</b></td><td class="r num ${cls(c.margin)}">${pct(c.margin)}</td><td class="r num">${pct(c.markup, 0)}</td><td class="r num">${pct(c.roi, 0)}</td>
        <td class="r num">${isFinite(c.breakEven) ? money(c.breakEven) : '—'}</td><td class="r num">${sold.units}</td><td class="r num ${cls(sold.profit)}">${money(sold.profit)}</td>
        <td><div class="actions"><button class="btn sm" data-act="new-sale" data-pid="${x.platform}" data-prod="${x.id}" title="Registrar venda">Vender</button><button class="icon-btn" data-act="edit-product" data-id="${x.id}" title="Editar">✎</button><button class="icon-btn" data-act="copy-product" data-id="${x.id}" title="Duplicar / copiar para outra plataforma">⧉</button><button class="icon-btn danger" data-act="del-product" data-id="${x.id}" title="Excluir">🗑</button></div></td></tr>`;
    });
    const cols = pid ? 0 : 1;
    h += `</tbody><tfoot><tr><td colspan="${2 + cols}">${list.length} produtos</td><td class="r num">${n2(tot.units)}</td><td class="r num" colspan="2">${money(tot.stockVal)} <span class="muted small">em estoque</span></td><td colspan="6" class="r small muted">Lucro potencial do estoque: <span class="${cls(tot.potential)}">${money(tot.potential)}</span></td><td colspan="3"></td><td class="r num">${tot.sold}</td><td class="r num ${cls(tot.sprofit)}">${money(tot.sprofit)}</td><td></td></tr></tfoot></table></div>`;
    wrap.innerHTML = h;
  }

      mercadolivre: ['Anúncio Clássico costuma ter comissão menor que o Premium.', 'Produtos abaixo de R$ 79 pagam um custo fixo por unidade (configurado acima).', 'Acima de R$ 79 o frete grátis costuma ser pago por você: preencha o campo Frete.'],
      magalu: ['Comissão por categoria mais taxa fixa por item vendido.', 'Frete do Magalu Entregas pode ser subsidiado: ajuste o frete por produto.', 'Anúncios patrocinados: registre em Despesas.'],
    };
