/* Returns n items from arr, advancing a saved cursor so each call gives a
   different, non-repeating window (cycles through the whole pool before
   repeating). Keeps sessions/days fresh. */
function rotate(key, arr, n){
  if(!arr||arr.length===0) return [];
  n=Math.min(n, arr.length);
  let cur=0;
  try{ const c=JSON.parse(localStorage.getItem('goup.cursors')||'{}'); cur=c[key]||0; c[key]=(cur+n)%arr.length; localStorage.setItem('goup.cursors', JSON.stringify(c)); }
  catch(e){ cur=Math.floor(Math.random()*arr.length); }
  const out=[]; for(let i=0;i<n;i++) out.push(arr[(cur+i)%arr.length]);
  return out;
}

/* ---- demo grammar engine ---- */
function detectCorrection(text){
  const s = text.trim();
  const rules = [
    { t:/\b(yesterday|last night|last week|last year|ago)\b[^.?!]*\bi go\b/i, f:x=>({c:x.replace(/\bi go\b/i,'I went'), e:"We use the past tense \"went\" because you're talking about the past."}) },
    { t:/\bi have\s+(\d+)\s+years?\b/i, f:x=>({c:x.replace(/\bi have\s+\d+\s+years?\b/i, m=>'I am '+m.match(/\d+/)[0]+' years old'), e:'In English we say "I am ... years old", not "I have ... years".'}) },
    { t:/\b(he|she|it)\s+(go|have|do|want|like|need|play|work|live|watch|make)\b/i, f:x=>{ const m=x.match(/\b(he|she|it)\s+(go|have|do|want|like|need|play|work|live|watch|make)\b/i); const map={go:'goes',have:'has',do:'does',want:'wants',like:'likes',need:'needs',play:'plays',work:'works',live:'lives',watch:'watches',make:'makes'}; const fixed=map[m[2].toLowerCase()]||m[2]+'s'; return {c:x.replace(m[0], m[1]+' '+fixed), e:'With he/she/it in the present simple, the verb takes an "-s": "'+m[1]+' '+fixed+'".'}; } },
    { t:/\bi am agree\b/i, f:x=>({c:x.replace(/\bi am agree\b/i,'I agree'), e:'"Agree" is a verb, so we say "I agree" (not "I am agree").'}) },
    { t:/\bmore better\b/i, f:x=>({c:x.replace(/\bmore better\b/i,'better'), e:'"Better" is already comparative, so we don\'t add "more".'}) },
    { t:/\bdidn'?t\s+(went|had|saw|ate|took|made)\b/i, f:x=>{ const m=x.match(/\bdidn'?t\s+(went|had|saw|ate|took|made)\b/i); const map={went:'go',had:'have',saw:'see',ate:'eat',took:'take',made:'make'}; return {c:x.replace(m[0], "didn't "+(map[m[1].toLowerCase()]||m[1])), e:'After "didn\'t" we use the base verb, not the past form.'}; } },
  ];
  for(const r of rules){ if(r.t.test(s)){ const {c,e}=r.f(s); if(c.toLowerCase()!==s.toLowerCase()) return {original:s, corrected:c, explanation:e}; } }
  return null;
}
const OPENERS=["That's a great point!",'Nice — I understood you clearly.','Good job expressing that!','I like how you put that.',"Interesting! Let's keep going."];
const FOLLOWS=['Can you tell me a little more?','What made you feel that way?','And what happened next?','Why do you think that is?','Can you give me an example?'];
function topical(text, level){
  const t=text.toLowerCase();
  if(/\b(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(t)) return "Hello! It's really nice to talk with you. How are you doing today?";
  if(/\b(thank you|thanks)\b/.test(t)) return "You're very welcome! Keep up the great work. What would you like to talk about next?";
  if(/\b(food|eat|restaurant|hungry|lunch|dinner)\b/.test(t)) return "Food is a great topic! What's a dish you really enjoy, and how do you make it?";
  if(/\b(work|job|office|boss)\b/.test(t)) return 'Tell me about your work. What do you do, and what part do you enjoy most?';
  if(/\b(travel|trip|vacation|holiday|country|city)\b/.test(t)) return "Travel is exciting! What's a place you'd love to visit, and why?";
  if(/\b(weather|rain|sunny|cold|hot)\b/.test(t)) return "Let's talk about the weather. What's it like where you are right now?";
  const o=OPENERS[Math.floor(Math.random()*OPENERS.length)], f=FOLLOWS[Math.floor(Math.random()*FOLLOWS.length)];
  return (level==='A1'||level==='A2') ? (o+' '+f) : (o+' '+f.toLowerCase());
}
function demoReply(text, level, lang){
  const corr = detectCorrection(text);
  let content;
  if(corr){
    content = 'I understood you! 👍 A more natural sentence would be: "'+corr.corrected+'" '+corr.explanation + (lang==='bi'?' (Você foi bem — só um pequeno ajuste!)':'');
    content += '\n\n' + topical(text, level);
  } else {
    content = topical(text, level);
    if(lang==='bi' && Math.random()<0.25) content += ' (Continue assim!)';
  }
  return { content, correction: corr };
}

/* ============================ TTS + SPEECH HOOKS ============================ */
function scoreVoice(v){
  const n=(v.name||'').toLowerCase(); const l=(v.lang||'').toLowerCase(); let s=0;
  if(l.indexOf('en')===0) s+=5; if(l==='en-us'||l==='en_us') s+=4; if(l==='en-gb') s+=2;
  if(/natural|neural|online/.test(n)) s+=10;   // modern, human-like voices
  if(/enhanced|premium|siri/.test(n)) s+=8;    // downloaded high-quality iOS/Android voices
  if(/google/.test(n)) s+=7;
  if(/aria|jenny|emma|ava|libby|sonia|michelle|nova|samantha/.test(n)) s+=6;  // friendly-sounding
  if(/microsoft/.test(n)) s+=3;
  if(/guy|david|aaron|zira/.test(n)) s+=2;
  if(/compact|espeak|fallback|reduced|whisper|robo/.test(n)) s-=8;  // avoid muffled/robotic
  return s;
}
function pickBestVoice(voices){
  const en=voices.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0);
  const pool=en.length?en:voices;
  return pool.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0] || null;
}
function useTTS(){
  const supported = typeof window!=='undefined' && 'speechSynthesis' in window;
  const [voices,setVoices]=useState([]);
  useEffect(()=>{ if(!supported) return; const load=()=>setVoices(window.speechSynthesis.getVoices()); load(); window.speechSynthesis.onvoiceschanged=load; return ()=>{ window.speechSynthesis.onvoiceschanged=null; }; },[supported]);
  const speak=useCallback((text, rate=1, voiceName=null)=>{
    if(!supported||!text) return;
    const clean=text.replace(/\([^)]*\)/g,'').replace(/[*_#`]/g,'').trim();
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean||text);
    // Slightly slower + neutral pitch reads calmer and more natural.
    u.lang='en-US'; u.rate=Math.max(0.6, rate*0.95); u.pitch=1.0; u.volume=1.0;
    const v = voiceName ? voices.find(x=>x.name===voiceName) : pickBestVoice(voices);
    if(v) u.voice=v;
    // Small delay avoids the first-word clipping/muffling some engines have.
    setTimeout(()=>{ try{ window.speechSynthesis.speak(u); }catch(e){} }, 60);
  },[supported,voices]);
  const cancel=useCallback(()=>{ if(supported) window.speechSynthesis.cancel(); },[supported]);
  return { supported, voices, speak, cancel };
}
function useRecognition(){
  const Ctor = typeof window!=='undefined' ? (window.SpeechRecognition||window.webkitSpeechRecognition) : null;
  const supported=!!Ctor;
  const ref=useRef(null);
  const [listening,setListening]=useState(false);
  const [interim,setInterim]=useState('');
  const [error,setError]=useState(null);
  const onFinalRef=useRef(null);
  useEffect(()=>{
    if(!supported) return;
    const rec=new Ctor(); rec.lang='en-US'; rec.continuous=false; rec.interimResults=true; rec.maxAlternatives=1;
    let finalText='';
    rec.onresult=(e)=>{ let itr=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText+=r[0].transcript; else itr+=r[0].transcript; } setInterim(itr); };
    rec.onerror=(e)=>{ setError(e.error==='not-allowed'||e.error==='service-not-allowed' ? 'mic' : e.error==='no-speech'?'nospeech':'err'); setListening(false); };
    rec.onend=()=>{ setListening(false); setInterim(''); const t=finalText.trim(); finalText=''; if(t && onFinalRef.current) onFinalRef.current(t); };
    ref.current=rec;
    return ()=>{ try{ rec.abort(); }catch(e){} };
  },[supported]);
  const start=useCallback((onFinal)=>{ if(!ref.current||listening) return; onFinalRef.current=onFinal; setError(null); setInterim(''); try{ ref.current.start(); setListening(true); }catch(e){} },[listening]);
  const stop=useCallback(()=>{ try{ ref.current&&ref.current.stop(); }catch(e){} setListening(false); },[]);
  return { supported, listening, interim, error, start, stop };
}
/* Resolves the real-AI "sample" capability: a function when the page can ask
   Claude live, or null when it can't (served as a plain file, no consent, etc.). */
function useSample(){
  // Self-hosted AI via the school's own backend (/api/chat). No user account needed.
  const [fn,setFn]=useState(undefined);
  useEffect(()=>{
    const url=(window.GOUP_API_BASE||'')+'/api/chat';
    async function ask(input, opts){
      opts=opts||{};
      const messages = typeof input==='string'
        ? [{role:'user',content:input}]
        : (input||[]).map(m=>({role:m.role==='assistant'?'assistant':'user',content:String(m.content||'')})).filter(m=>m.content);
      let r;
      try{ r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})}); }
      catch(e){ const err=new Error('network'); err.code='upstream_error'; throw err; }
      if(!r.ok){ const err=new Error('http'); err.code=(r.status===429?'rate_limited':'upstream_error'); throw err; }
      const d=await r.json(); const text=(d&&d.text)||'';
      if(!text){ const err=new Error('empty'); err.code='empty_completion'; throw err; }
      if(opts.onText){ try{ opts.onText({text:text, delta:text}); }catch(e){} }
      return { text:text, truncated:false };
    }
    ask.json=async function(input,opts){
      const {text}=await ask(input,opts);
      let s=(text||'').trim();
      const fence=s.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if(fence){ s=fence[1].trim(); }
      else { const a=s.indexOf('{'),b=s.lastIndexOf('}'),a2=s.indexOf('['),b2=s.lastIndexOf(']'); let i=-1,j=-1; if(a>=0&&b>a){i=a;j=b;} if(a2>=0&&b2>a2&&(i<0||a2<i)){i=a2;j=b2;} if(i>=0) s=s.slice(i,j+1); }
      return JSON.parse(s);
    };
    setFn(()=>ask);
    return ()=>{};
  },[]);
  return fn;
}

/* Logo — placeholder mark (blue badge + white up-arrow) until the school's symbol is added.
   Swap the <div className="...badge..."> below for an <img src="LOGO_URL"/> when you have it. */
function Logo({size=38, text=true}){
  return <div className="flex items-center gap-2.5">
    <img src={LOGO_SRC} alt="Go Up School" className="shrink-0 rounded-full object-cover" style={{width:size,height:size}}/>
    {text && <span className="text-lg font-extrabold tracking-tight"><span className="text-brand-blue">Go</span> <span className="text-brand-red">Up</span></span>}
  </div>;
}
/* Custom Go Up streak flame: blue→red gradient with the Go Up symbol inside. */
function StreakFlame({size=22, className=''}){
  const rid=('sf'+React.useId()).replace(/[:]/g,'');
  const gid='g'+rid, cid='c'+rid;
  return <svg width={size} height={size} viewBox="0 0 48 48" className={className} aria-hidden="true" style={{display:'inline-block',verticalAlign:'-0.18em'}}>
    <defs>
      <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor="#1560D6"/>
        <stop offset="52%" stopColor="#3b82f6"/>
        <stop offset="100%" stopColor="#E11D2A"/>
      </linearGradient>
      <clipPath id={cid}><circle cx="24" cy="29" r="8.4"/></clipPath>
    </defs>
    <path d="M24 4 C 28 13, 35 17, 35 28 C 35 38, 30 43, 24 43 C 18 43, 13 38, 13 28 C 13 21, 17 19, 19.5 23 C 20.5 16, 20.5 10, 24 4 Z" fill={'url(#'+gid+')'}/>
    <circle cx="24" cy="29" r="9.4" fill="#ffffff"/>
    <image href={LOGO_SRC} x="15.6" y="20.6" width="16.8" height="16.8" clipPath={'url(#'+cid+')'} preserveAspectRatio="xMidYMid slice"/>
  </svg>;
}
function Bar({value,color='bg-brand-blue'}){ const v=Math.max(0,Math.min(100,value)); return <div className="h-2.5 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800"><div className={'h-full rounded-full transition-all duration-500 '+color} style={{width:v+'%'}}/></div>; }
function LangToggle(){ const {lang,setLang}=useLang(); return <div className="flex rounded-lg bg-slate-100 p-0.5 text-xs font-bold dark:bg-slate-800">{['pt','en'].map(x=><button key={x} onClick={()=>setLang(x)} className={'rounded-md px-2 py-1 transition '+(lang===x?'bg-brand-blue text-white':'text-slate-500 dark:text-slate-400')}>{x.toUpperCase()}</button>)}</div>; }
function ThemeBtn(){ const {dark,setDark}=useTheme(); return <button onClick={()=>setDark(!dark)} className="grid h-10 w-10 place-items-center rounded-xl bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">{dark?<SunI s={18}/>:<MoonI s={18}/>}</button>; }

/* ============================ STORE ============================ */
function useStore(){
  const [profile,setProfile]=useState(()=>read(K.profile,null));
  const [progress,setProgress]=useState(()=>read(K.progress,defaultProgress()));
  const [vocab,setVocab]=useState(()=>{ const mk=s=>({id:uid('w'),word:s[0],phon:s[1],tr:s[2],ex:s[3],fav:false,known:false,weight:1}); let v=read(K.vocab,null); if(!v){ v=SEED_VOCAB.map(mk); write(K.vocab,v); return v; } const have=new Set(v.map(w=>(w.word||'').toLowerCase())); const add=SEED_VOCAB.filter(s=>!have.has(s[0].toLowerCase())).map(mk); if(add.length){ v=[...v,...add]; write(K.vocab,v); } return v; });

  const saveProfile=(p)=>{ setProfile(p); write(K.profile,p); };
  const saveProgress=(fn)=>{ setProgress(prev=>{ const next=typeof fn==='function'?fn({...prev}):fn; write(K.progress,next); return next; }); };
  const saveVocab=(v)=>{ setVocab(v); write(K.vocab,v); saveProgress(p=>({...p, words: v.filter(w=>w.known).length})); };
  const addTime=(min)=>saveProgress(p=>{ const t=todayStr(); const s=p.sessions.find(x=>x.date===t); if(s) s.minutes+=min; else p.sessions.push({date:t,minutes:min}); p.sessions=p.sessions.slice(-60); p.minutes+=min; if(p.last!==t){ const y=todayStr(new Date(Date.now()-864e5)); p.streak = p.last===y ? p.streak+1 : 1; p.last=t; } return p; });
  // XP toward the next level rises slowly on purpose — a level-up should mean real mastery.
  const bump=(skill,d)=>saveProgress(p=>{ p.skills[skill]=Math.max(0,Math.min(100,p.skills[skill]+d)); p.xp=Math.max(0,Math.min(100,p.xp+Math.max(0,d)*0.3)); return p; });
  const addTopic=(t)=>saveProgress(p=>{ if(p.topics.indexOf(t)<0) p.topics=[...p.topics,t]; return p; });
  const levelUp=()=>{ const order=['A1','A2','B1','B2','C1','C2']; const cur=profile?profile.level:'A1'; const nl=order[Math.min(order.indexOf(cur)+1, order.length-1)]; if(profile) saveProfile({...profile, level:nl}); saveProgress(p=>({...p, xp:0})); return nl; };
  const reset=()=>{ [K.profile,K.progress,K.vocab].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}}); setProfile(null); setProgress(defaultProgress()); const v=SEED_VOCAB.map(s=>({id:uid('w'),word:s[0],phon:s[1],tr:s[2],ex:s[3],fav:false,known:false,weight:1})); setVocab(v); write(K.vocab,v); };
  return { profile,saveProfile, progress,saveProgress, vocab,saveVocab, addTime,bump,addTopic,levelUp,reset };
}

/* ============================ INSTALL / QR MODAL ============================ */
function InstallModal({onClose}){
  const {t}=useLang();
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current; if(!el) return; el.innerHTML='';
    try{
      if(window.QRCode){ new window.QRCode(el,{ text:window.location.href, width:210, height:210, colorDark:'#1560D6', colorLight:'#ffffff', correctLevel:window.QRCode.CorrectLevel.H }); }
      else { el.textContent='—'; }
    }catch(e){ el.textContent='—'; }
  },[]);
  return <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={onClose}>
    <div className="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl dark:bg-slate-900" onClick={e=>e.stopPropagation()}>
      <div className="flex items-center justify-between"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">{t('inst_title')}</h3><button onClick={onClose} className="grid h-8 w-8 place-items-center rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"><XI s={18}/></button></div>
      <div className="mt-4 flex justify-center"><div ref={ref} className="grid min-h-[210px] min-w-[210px] place-items-center rounded-xl border border-slate-100 p-3 text-slate-300 dark:border-slate-700"/></div>
      <p className="mt-4 text-sm font-semibold text-slate-700 dark:text-slate-200">📱 {t('inst_scan')}</p>
      <ol className="mt-2 list-decimal space-y-1 pl-5 text-sm text-slate-600 dark:text-slate-300">
        <li>{t('inst_i1')}</li>
        <li>{t('inst_i2')}</li>
        <li>{t('inst_i3')}</li>
      </ol>
    </div>
  </div>;
}

/* ============================ ONBOARDING ============================ */
function Onboarding({store, go}){
  const {t,lang}=useLang();
  const [step,setStep]=useState(0), [name,setName]=useState(''), [email,setEmail]=useState(''), [level,setLevel]=useState(null), [goals,setGoals]=useState([]);
  const GOALS = lang==='pt' ? ['Viajar','Carreira e trabalho','Estudos e provas','Conversar com amigos','Só por diversão'] : ['Travel abroad','Career & work','Studies & exams','Talk with friends','Just for fun'];
  const toggleGoal=(g)=>setGoals(prev=> prev.includes(g)?prev.filter(x=>x!==g):(prev.length>=3?prev:[...prev,g]));
  const goalsOk=goals.length>=2;
  const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  const canNext = step===0 ? (name.trim() && emailOk) : step===1 ? level : goalsOk;
  const finish=()=>{ if(!goalsOk) return; store.saveProfile({ name:name.trim()||'Learner', email:email.trim().toLowerCase(), level:level||'A1', goal:goals.join(', '), goals:goals, createdAt:Date.now(), settings:{ lang:'bi', rate:1, voice:null, difficulty:'normal', notifications:true } }); go(); };
  return <div className="grid min-h-screen place-items-center bg-gradient-to-b from-white to-slate-50 px-5 py-10 dark:from-slate-950 dark:to-slate-900">
    <div className="w-full max-w-lg">
      <div className="mb-8 flex flex-col items-center gap-4"><Logo size={44}/><div className="flex gap-1.5">{[0,1,2].map(i=><span key={i} className={'h-1.5 w-10 rounded-full '+(i<=step?'bg-brand-blue':'bg-slate-200 dark:bg-slate-700')}/>)}</div><LangToggle/></div>
      <div className="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-8">
        {step===0 && <div className="fadein"><h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">{t('o_acc_q')}</h1><p className="mt-2 text-slate-600 dark:text-slate-300">{t('o_acc_hint')}</p>
          <input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder={t('o_name_ph')} className="mt-6 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-brand-blue dark:border-slate-700 dark:bg-slate-800 dark:text-white"/>
          <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&canNext&&setStep(1)} type="email" inputMode="email" autoComplete="email" placeholder={t('o_email_ph')} className="mt-3 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-brand-blue dark:border-slate-700 dark:bg-slate-800 dark:text-white"/>
          {email.trim() && !emailOk && <p className="mt-2 text-xs text-brand-red">{t('o_email_invalid')}</p>}
        </div>}
        {step===1 && <div className="fadein"><h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">{t('o_level_q')}</h1><p className="mt-2 text-slate-600 dark:text-slate-300">{t('o_level_hint')}</p><div className="mt-6 grid gap-2.5">{LEVELS.map(l=><button key={l.id} onClick={()=>setLevel(l.id)} className={'flex items-center justify-between rounded-xl border px-4 py-3 text-left '+(level===l.id?'border-brand-blue bg-blue-50 dark:bg-blue-500/10':'border-slate-200 dark:border-slate-700')}><div><p className="font-bold text-slate-900 dark:text-white">{l.id} · {lang==='pt'?l.pt:l.en}</p><p className="text-sm text-slate-500 dark:text-slate-400">{lang==='pt'?l.bp:l.be}</p></div>{level===l.id&&<span className="grid h-6 w-6 place-items-center rounded-full bg-brand-blue text-white"><CheckI s={14}/></span>}</button>)}</div></div>}
        {step===2 && <div className="fadein"><h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">{t('o_goal_q')}</h1><p className="mt-2 text-slate-600 dark:text-slate-300">{t('o_goal_hint')}</p><div className="mt-6 flex flex-wrap gap-2.5">{GOALS.map((g)=>{ const on=goals.includes(g); return <button key={g} onClick={()=>toggleGoal(g)} className={'inline-flex items-center gap-1 rounded-full border px-4 py-2 text-sm font-semibold '+(on?'border-brand-blue bg-brand-blue text-white':'border-slate-200 text-slate-600 dark:border-slate-700 dark:text-slate-300')}>{on&&<CheckI s={14}/>}{g}</button>; })}</div><p className="mt-3 text-xs text-slate-400">{goals.length+'/3'}{goals.length<2?(lang==='pt'?' · escolha pelo menos 2':' · pick at least 2'):''}</p></div>}
        <div className="mt-8 flex items-center justify-between">
          <button onClick={()=>setStep(Math.max(0,step-1))} className="rounded-xl bg-slate-100 px-4 py-2.5 text-sm font-semibold text-slate-700 dark:bg-slate-800 dark:text-slate-200">{t('back')}</button>
          {step<2 ? <button disabled={!canNext} onClick={()=>setStep(step+1)} className="inline-flex items-center gap-2 rounded-xl bg-brand-blue px-4 py-2.5 text-sm font-semibold text-white disabled:opacity-50">{t('continue')} <ArrowI s={18}/></button>
            : <button onClick={finish} disabled={!goalsOk} className="inline-flex items-center gap-2 rounded-xl bg-brand-blue px-4 py-2.5 text-sm font-semibold text-white disabled:opacity-50">{t('o_start')} <ArrowI s={18}/></button>}
        </div>
      </div>
    </div>
  </div>;
}

/* ============================ CHAT BUBBLE ============================ */
function Bubble({m, rate, voice}){
  const {t}=useLang(); const tts=useTTS(); const sample=useSample();
  const [tr,setTr]=useState(null); const [trLoading,setTrLoading]=useState(false);
  const translate=async ()=>{
    if(tr){ setTr(null); return; }               // toggle off
    if(typeof sample!=='function'||!m.content) return;
    setTrLoading(true);
    try{ const {text}=await sample('Translate the following English text into natural Brazilian Portuguese (pt-BR). Reply with ONLY the translation — no quotes, no notes:\n\n'+m.content, {modelTier:'quick'}); setTr((text||'').trim()); }
    catch(e){ setTr(null); }
    finally{ setTrLoading(false); }
  };
  if(m.role==='user') return <div className="ml-auto max-w-[85%] fadein"><div className="rounded-2xl rounded-tr-sm bg-brand-blue px-4 py-2.5 text-white shadow"><p className="whitespace-pre-wrap text-sm leading-relaxed">{m.content}</p></div></div>;
  return <div className="mr-auto max-w-[88%] fadein"><div className="rounded-2xl rounded-tl-sm bg-white px-4 py-3 shadow dark:bg-slate-800">
    <p className="whitespace-pre-wrap text-sm leading-relaxed text-slate-800 dark:text-slate-100">{m.content}</p>
    {m.correction && <div className="mt-2.5 rounded-xl border border-green-100 bg-green-50 px-3 py-2 text-xs dark:border-green-500/20 dark:bg-green-500/10"><span className="font-semibold" style={{color:'#22c55e'}}>Correction · </span><span className="text-slate-500 line-through dark:text-slate-400">{m.correction.original}</span> <span className="font-semibold text-slate-800 dark:text-slate-100">→ {m.correction.corrected}</span></div>}
    {m.content && <div className="mt-2.5 flex flex-wrap items-center gap-1.5">
      {tts.supported && <button onClick={()=>tts.speak(m.content, rate, voice)} className="inline-flex items-center gap-1 rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 dark:bg-slate-700 dark:text-slate-200"><SpkI s={14}/> {t('listen')}</button>}
      {typeof sample==='function' && <button onClick={translate} disabled={trLoading} className="inline-flex items-center gap-1 rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 disabled:opacity-60 dark:bg-slate-700 dark:text-slate-200"><GlobeI s={14}/> {trLoading?t('bb_translating'):tr?t('bb_hide'):t('bb_translate')}</button>}
    </div>}
    {tr && <div className="mt-2 rounded-xl border border-blue-100 bg-blue-50 px-3 py-2 text-sm text-slate-700 dark:border-blue-500/20 dark:bg-blue-500/10 dark:text-slate-200">{tr}</div>}
  </div></div>;
}

/* ============================ TUTOR ============================ */
function Tutor({store, scenario, clearScenario}){
  const {t,lang}=useLang();
  const {profile,addTime,bump,saveProgress}=store;
  const s=profile.settings;
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [mode,setMode]=useState('text');
  const [thinking,setThinking]=useState(false);
  const scrollRef=useRef(null);
  const tts=useTTS();
  const rec=useRecognition();
  const sample=useSample();
  const aiOn = typeof sample==='function';

  useEffect(()=>{
    setMsgs([]);
    const opener = scenario ? scenario.opener : ('Hi '+profile.name+'! 👋 I\'m your English tutor. What would you like to talk about today? You can type, or tap the mic to try speaking.');
    setMsgs([{id:uid('m'),role:'assistant',content:opener}]);
    saveProgress(p=>({...p, chats:p.chats+1}));
  // eslint-disable-next-line
  },[scenario]);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[msgs,thinking]);

  const send=async (text, spoken)=>{
    const c=(text||'').trim(); if(!c||thinking) return; setInput('');
    const userMsg={id:uid('m'),role:'user',content:c};
    const history=msgs;
    setMsgs(prev=>[...prev,userMsg]);
    setThinking(true);
    if(typeof sample==='function'){
      const aiId=uid('m');
      setMsgs(prev=>[...prev,{id:aiId,role:'assistant',content:'',pending:true}]);
      const RULES='You are a warm, friendly English tutor at the "Go Up" English school, talking with a Brazilian student named '+(profile.name||'the student')+' (CEFR level '+profile.level+'). Have a real, natural human conversation: actually respond to what the student just said — react to it, ask about it, keep it flowing. Never give generic or templated answers. '+(scenario?('Stay in this role-play scenario: '+scenario.title+'. '):'')+'Match your vocabulary to level '+profile.level+'. When the student makes an English mistake, gently show the corrected sentence in quotes with a one-line reason, then continue naturally. Keep replies short (2-4 sentences) and end with a natural follow-up question. '+(s.lang==='bi'?'You may add a short Portuguese (pt-BR) note in parentheses when it helps.':'Reply in English only.');
      const convo=[...history, userMsg].map(m=>({role:m.role,content:(m.content||'').trim()})).filter(m=>m.content).slice(-14);
      try{
        const res=await sample([{role:'user',content:RULES}, ...convo], { cache:false, modelTier:'quick', onText:({text})=>{ setThinking(false); setMsgs(prev=>prev.map(m=>m.id===aiId?{...m,content:text,pending:false}:m)); } });
        setMsgs(prev=>prev.map(m=>m.id===aiId?{...m,content:res.text,pending:false}:m));
        setThinking(false); addTime(1); bump(spoken?'speaking':'writing',2);
        if(spoken && tts.supported) tts.speak(res.text, s.rate, s.voice);
      }catch(e){
        const d=demoReply(c, profile.level, s.lang);
        setMsgs(prev=>prev.map(m=>m.id===aiId?{...m,content:d.content,correction:d.correction,pending:false}:m));
        setThinking(false); addTime(1); bump(spoken?'speaking':'writing',2); if(d.correction) bump('grammar',1);
        if(spoken && tts.supported) tts.speak(d.content, s.rate, s.voice);
      }
      return;
    }
    setTimeout(()=>{
      const res=demoReply(c, profile.level, s.lang);
      setMsgs(prev=>[...prev,{id:uid('m'),role:'assistant',content:res.content,correction:res.correction}]);
      setThinking(false);
      addTime(1); bump(spoken?'speaking':'writing',2); if(res.correction) bump('grammar',1);
      if(spoken && tts.supported) tts.speak(res.content, s.rate, s.voice);
    }, 500+Math.random()*500);
  };
  const setSetting=(patch)=>store.saveProfile({...profile, settings:{...s,...patch}});
  const toggleMic=()=>{ if(rec.listening) rec.stop(); else { tts.cancel(); rec.start(x=>send(x,true)); } };
  const errMsg = rec.error==='mic' ? (lang==='pt'?'O microfone está bloqueado nesta pré-visualização. Abra o site em uma aba do navegador (Chrome) e toque em "Permitir" quando pedir o microfone. Aqui o modo texto funciona 100%.':'The microphone is blocked in this preview. Open the site in a browser tab (Chrome) and tap "Allow" when it asks for the mic. Text mode works fully here.') : rec.error==='nospeech' ? (lang==='pt'?'Não ouvi nada. Tente de novo?':"I didn't hear anything. Try again?") : rec.error ? (lang==='pt'?'Erro de voz — tente o modo texto.':'Voice error — try text mode.') : null;

  return <div className="flex flex-col" style={{height:'calc(100vh - 11rem)'}}>
    <div className="mb-3 flex items-center justify-between gap-3">
      <div className="min-w-0"><h1 className="flex items-center gap-2 text-xl font-extrabold text-slate-900 dark:text-white">{scenario?<><span>{scenario.emoji}</span><span className="truncate">{lang==='pt'?scenario.tp:scenario.title}</span></>:t('nav_tutor')}</h1><p className="text-xs text-slate-500 dark:text-slate-400">{t('level_word')} {profile.level} · {s.lang==='bi'?'EN + PT':'EN'} · {aiOn?'IA':t('demo')}</p></div>
      {scenario && <button onClick={clearScenario} className="rounded-xl bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600 dark:bg-slate-800 dark:text-slate-300">{t('t_free')}</button>}
    </div>
    <div className="mb-3 flex flex-wrap items-center gap-2">
      <div className="flex rounded-xl bg-slate-100 p-1 dark:bg-slate-800"><button onClick={()=>setMode('text')} className={'rounded-lg px-3 py-1.5 text-xs font-semibold '+(mode==='text'?'bg-white text-brand-blue shadow dark:bg-slate-900':'text-slate-500 dark:text-slate-400')}>{t('t_text')}</button><button onClick={()=>setMode('voice')} className={'rounded-lg px-3 py-1.5 text-xs font-semibold '+(mode==='voice'?'bg-white text-brand-blue shadow dark:bg-slate-900':'text-slate-500 dark:text-slate-400')}>{t('t_voice')}</button></div>
      <button onClick={()=>setSetting({lang:s.lang==='bi'?'en':'bi'})} className="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">🌐 {s.lang==='bi'?'EN + PT':'EN only'}</button>
      <div className="flex items-center gap-1 rounded-full bg-slate-100 px-2 py-1 dark:bg-slate-800"><SpkI s={14} className="text-slate-500"/>{RATES.map(r=><button key={r} onClick={()=>setSetting({rate:r})} className={'rounded-full px-2 py-0.5 text-xs font-semibold '+(s.rate===r?'bg-brand-blue text-white':'text-slate-500 dark:text-slate-400')}>{r}x</button>)}</div>
    </div>
    <div ref={scrollRef} className="flex-1 space-y-3 overflow-y-auto rounded-2xl bg-slate-100/60 p-4 dark:bg-slate-900/50">
      {msgs.map(m=><Bubble key={m.id} m={m} rate={s.rate} voice={s.voice}/>)}
      {thinking && <div className="mr-auto flex max-w-[60%] items-center gap-1.5 rounded-2xl rounded-tl-sm bg-white px-4 py-3 shadow dark:bg-slate-800">{[0,1,2].map(i=><span key={i} className="inline-block h-2 w-2 rounded-full bg-slate-400" style={{animation:'fadein .6s infinite alternate',animationDelay:(i*0.15)+'s'}}/>)}</div>}
    </div>
    {mode==='text'
      ? <form onSubmit={e=>{e.preventDefault();send(input);}} className="mt-3 flex items-end gap-2">
          <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input);}}} rows={1} placeholder={t('t_ph')} className="max-h-32 flex-1 resize-none rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-brand-blue dark:border-slate-700 dark:bg-slate-900 dark:text-white"/>
          <button type="submit" disabled={!input.trim()||thinking} className="grid h-[46px] w-12 place-items-center rounded-xl bg-brand-blue text-white disabled:opacity-50"><SendI s={18}/></button>
        </form>
      : <div className="mt-3 flex flex-col items-center gap-2">
          {!rec.supported ? <p className="rounded-xl bg-blue-50 px-4 py-3 text-center text-sm text-brand-blue dark:bg-blue-500/10">{t('t_voice_unsup')}</p>
          : <><p className="h-5 text-sm text-slate-500 dark:text-slate-400">{rec.listening?(rec.interim||t('t_listening')):(thinking?t('t_processing'):t('t_tap'))}</p>
            <button onClick={toggleMic} disabled={thinking} className="relative grid h-16 w-16 place-items-center rounded-full text-white shadow-lg active:scale-95 disabled:opacity-50" style={{background:rec.listening?'#E11D2A':'#1560D6'}}>{rec.listening&&<span className="absolute inset-0 rounded-full pulsering" style={{background:'#E11D2A'}}/>}<MicI s={26}/></button>
            {errMsg && <p className="max-w-xs text-center text-xs" style={{color:'#E11D2A'}}>{errMsg}</p>}</>}
        </div>}
  </div>;
}

function pickW(words, ex){ const pool=words.filter(w=>w.id!==ex); const src=pool.length?pool:words; if(!src.length)return null; const tot=src.reduce((a,w)=>a+Math.max(1,w.weight),0); let r=Math.random()*tot; for(const w of src){ r-=Math.max(1,w.weight); if(r<=0)return w; } return src[0]; }

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============================ SPEAKING ============================ */
const PHRASES=['Good morning! How are you today?','I would like to order a coffee, please.','Could you tell me how to get to the station?','I have been learning English for two years.','What do you usually do on weekends?','Can I have the bill, please?'];
function Speaking({store}){
  const {t,lang}=useLang();
  const {bump,addTime,profile}=store; const rec=useRecognition(); const tts=useTTS();
  const [idx,setIdx]=useState(0),[result,setResult]=useState(null),[said,setSaid]=useState('');
  const target=PHRASES[idx];

  const onFinal=(x)=>{ setSaid(x); const spoken=new Set(cl(x).split(/\s+/)); const words=target.split(/\s+/).map(w=>({w,ok:spoken.has(cl(w))})); const m=words.filter(z=>z.ok).length; const score=Math.round(m/words.length*100); setResult({score,words}); bump('speaking',score>=70?3:1); addTime(1); };
  const record=()=>{ if(rec.listening){rec.stop();return;} setResult(null); setSaid(''); tts.cancel(); rec.start(onFinal); };
  const nextP=()=>{ setResult(null); setSaid(''); setIdx((idx+1)%PHRASES.length); };

/* ============================ REVIEW (class practice) ============================ */
const REVIEW_KW = {
  tobe:['to be','verbo to be','am is are','am, is','ser','estar','verbo ser','am/is/are','is are'],
  present:['present simple','presente simples','rotina','routine','hábito','habito','goes','does',' present'],
  past:['past simple','passado','went','ontem','yesterday','-ed','irregular',' past'],
  cont:['present continuous','continuous','contínuo','continuo','gerúndio','gerundio','-ing',' ing ','acontecendo agora'],
  future:['future','futuro',' will','going to','vou ','plano'],
  compar:['comparative','comparativo','comparativos','than','mais que','melhor','better','best','-er'],
};
function Review({store}){
  const {t,lang}=useLang();
  const tts=useTTS(); const s=store.profile.settings;
  const sample=useSample();
  const [input,setInput]=useState('');
  const [L,setL]=useState(null);          // null | 'none' | normalized lesson
  const [loading,setLoading]=useState(false);
  const [quiz,setQuiz]=useState(false);
  const [done,setDone]=useState(null);

  const detect=(txt)=>{ const q=' '+txt.toLowerCase()+' '; for(const g of GRAMMAR){ const kws=REVIEW_KW[g.id]||[]; if(q.indexOf(g.title.toLowerCase())>=0 || q.indexOf((g.tp||'').toLowerCase())>=0 || kws.some(k=>q.indexOf(k)>=0)) return g; } return null; };
  const fromPreset=(g)=>({ title: lang==='pt'?g.tp:g.title, emoji:g.emoji, explanation: lang==='pt'?g.ep:g.explanation, examples: rotate('rv_'+g.id+'_ex', g.examples, 6), quiz: rotate('rv_'+g.id+'_qz', g.exercises, 8).map(e=>({...e})) });

  const generate=async (topic)=>{
    const txt=(topic||'').trim(); if(!txt||loading) return;
    setDone(null); setQuiz(false);
    if(typeof sample==='function'){
      setLoading(true); setL(null);
      const prompt='You are an English teacher for a Brazilian student (CEFR level '+store.profile.level+'). Today\'s class was about: "'+txt+'". Create a short review lesson about EXACTLY that topic. Reply with ONLY a JSON object shaped like: {"title": string, "emoji": string (one emoji), "explanation": string, "examples": [{"en": string, "pt": string}], "quiz": [{"type": "mc"|"fill"|"tr", "prompt": string, "options": string[], "answer": string, "why": string}]}. Rules: write "explanation", every "why", and any instructions in '+(lang==='pt'?'Portuguese (pt-BR)':'English')+', simple and clear for level '+store.profile.level+'. Give 10 "examples" (a natural English sentence + its pt-BR translation). Give 8 "quiz" items about this topic, mixing the types: "mc" = an English question with exactly 3 "options" (one correct); "fill" = an English sentence with a ___ gap and NO options; "tr" = a pt-BR sentence in "prompt" to be translated into English in "answer", NO options. "answer" must be the exact expected text. "why" is a one-line reason the answer is correct. Output only the JSON, nothing else.';
      try{
        const data=await sample.json(prompt, { modelTier:'default' });
        const ex=Array.isArray(data.examples)?data.examples.filter(e=>e&&e.en).map(e=>({en:String(e.en),pt:String(e.pt||'')})).slice(0,12):[];
        const qz=Array.isArray(data.quiz)?data.quiz.filter(q=>q&&q.prompt&&q.answer).map(q=>({ type:q.type==='mc'?'mc':q.type==='fill'?'fill':'tr', prompt:String(q.prompt), options:Array.isArray(q.options)&&q.options.length?q.options.map(String):undefined, answer:String(q.answer), wy:{pt:String(q.why||''),en:String(q.why||'')} })).slice(0,10):[];
        if(ex.length===0 && qz.length===0) throw new Error('empty');
        setL({ title:String(data.title||txt), emoji:String(data.emoji||'📘'), explanation:String(data.explanation||''), examples:ex, quiz:qz });
      }catch(e){ const g=detect(txt); setL(g?fromPreset(g):'none'); }
      finally{ setLoading(false); }
    } else {
      const g=detect(txt); setL(g?fromPreset(g):'none');
    }
  };

  const openPreset=(g)=>{ setInput(lang==='pt'?g.tp:g.title); setDone(null); setQuiz(false); setL(fromPreset(g)); };
  const back=()=>{ setL(null); setQuiz(false); setDone(null); setInput(''); };
  const chips = <div className="mt-4 flex flex-wrap gap-2">{GRAMMAR.map(g=><button key={g.id} onClick={()=>openPreset(g)} className="rounded-full border border-slate-200 px-3.5 py-1.5 text-sm font-semibold text-slate-600 transition hover:border-brand-blue dark:border-slate-700 dark:text-slate-300">{g.emoji} {lang==='pt'?g.tp:g.title}</button>)}</div>;

  if(L && L!=='none'){
    const need=Math.max(1,Math.ceil(L.quiz.length*0.6));

/* ============================ DOUBTS (bilingual Q&A chat) ============================ */
function Doubts({store}){
  const {t,lang}=useLang();
  const sample=useSample();
  const s=store.profile.settings;
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [thinking,setThinking]=useState(false);
  const scrollRef=useRef(null);
  const started=useRef(false);
  useEffect(()=>{ if(started.current)return; started.current=true; setMsgs([{id:uid('m'),role:'assistant',content:t('dbt_hello')}]); /* eslint-disable-next-line */ },[]);
  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[msgs,thinking]);
  const send=async(text)=>{
    const c=(text||'').trim(); if(!c||thinking) return; setInput('');
    const userMsg={id:uid('m'),role:'user',content:c};
    const history=msgs;
    setMsgs(prev=>[...prev,userMsg]); setThinking(true);
    if(typeof sample!=='function'){ setMsgs(prev=>[...prev,{id:uid('m'),role:'assistant',content:t('dbt_need_ai')}]); setThinking(false); return; }
    const aiId=uid('m'); setMsgs(prev=>[...prev,{id:aiId,role:'assistant',content:'',pending:true}]);
    const RULES='You are a friendly, knowledgeable English-learning assistant at the "Go Up" English school, helping a Brazilian student (CEFR level '+store.profile.level+'). Answer their questions about English — grammar, vocabulary, pronunciation, meaning, translation, study tips — clearly and warmly, with short examples. IMPORTANT: reply in the SAME language the student wrote in (Portuguese or English). Keep answers focused, not too long.';
    const convo=[...history, userMsg].map(m=>({role:m.role,content:(m.content||'').trim()})).filter(m=>m.content).slice(-14);
    try{
      const res=await sample([{role:'user',content:RULES}, ...convo], {cache:false, modelTier:'default', onText:({text})=>{ setThinking(false); setMsgs(prev=>prev.map(m=>m.id===aiId?{...m,content:text,pending:false}:m)); }});
      setMsgs(prev=>prev.map(m=>m.id===aiId?{...m,content:res.text,pending:false}:m)); setThinking(false); try{store.addTime(1);}catch(e){}
    }catch(e){ setMsgs(prev=>prev.map(m=>m.id===aiId?{...m,content:(lang==='pt'?'Não consegui responder agora. Tente de novo.':'I could not answer right now. Please try again.'),pending:false}:m)); setThinking(false); }
  };
  return <div className="flex flex-col" style={{height:'calc(100vh - 11rem)'}}>
    <div className="mb-3"><h1 className="text-xl font-extrabold text-slate-900 dark:text-white">{t('dbt_title')}</h1><p className="text-xs text-slate-500 dark:text-slate-400">{t('dbt_sub')}</p></div>
    <div ref={scrollRef} className="flex-1 space-y-3 overflow-y-auto rounded-2xl bg-slate-100/60 p-4 dark:bg-slate-900/50">
      {msgs.map(m=><Bubble key={m.id} m={m} rate={s.rate} voice={s.voice}/>)}
      {thinking && <div className="mr-auto flex max-w-[60%] items-center gap-1.5 rounded-2xl rounded-tl-sm bg-white px-4 py-3 shadow dark:bg-slate-800">{[0,1,2].map(i=><span key={i} className="inline-block h-2 w-2 rounded-full bg-slate-400" style={{animation:'fadein .6s infinite alternate',animationDelay:(i*0.15)+'s'}}/>)}</div>}
    </div>
    <form onSubmit={e=>{e.preventDefault();send(input);}} className="mt-3 flex items-end gap-2">
      <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input);}}} rows={1} placeholder={t('dbt_ph')} className="max-h-32 flex-1 resize-none rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-brand-blue dark:border-slate-700 dark:bg-slate-900 dark:text-white"/>
      <button type="submit" disabled={!input.trim()||thinking} className="grid h-[46px] w-12 place-items-center rounded-xl bg-brand-blue text-white disabled:opacity-50"><SendI s={18}/></button>
    </form>
  </div>;
}

/* ============================ LEVEL TEST (30 questions, need 25) ============================ */
function LevelTest({store, done}){
  const {t,lang}=useLang();
  const sample=useSample();
  const order=['A1','A2','B1','B2','C1','C2'];
  const nextName=order[Math.min(order.indexOf(store.profile.level)+1,order.length-1)];
  const [phase,setPhase]=useState('intro');
  const [qs,setQs]=useState([]);
  const [score,setScore]=useState(0);
  const buildFromPool=()=>{ const pool=shuffle(GRAMMAR.flatMap(l=>l.exercises.map(e=>({...e})))); const out=[]; let i=0; while(out.length<30){ out.push(pool[i%pool.length]); i++; } return out; };
  const start=async ()=>{
    setPhase('loading');
    if(typeof sample==='function'){
      const prompt='Create a 30-question English level test for a Brazilian student at CEFR level '+store.profile.level+', checking they have really mastered '+store.profile.level+' before moving up. Reply with ONLY a JSON array of 30 items shaped: {"type":"mc"|"fill"|"tr","prompt":string,"options":string[],"answer":string,"why":string}. "mc" = an English question with exactly 3 options (one correct); "fill" = an English sentence with a ___ gap, NO options; "tr" = a pt-BR sentence in "prompt" to translate into English in "answer", NO options. "answer" must be the exact expected text. "why" is a one-line reason in '+(lang==='pt'?'Portuguese':'English')+'. Vary the grammar and vocabulary across the 30 items for level '+store.profile.level+'. Output only the JSON array.';
      try{
        const data=await sample.json(prompt,{modelTier:'default'});
        const arr=Array.isArray(data)?data:(data&&Array.isArray(data.questions)?data.questions:[]);
        const qz=arr.filter(q=>q&&q.prompt&&q.answer).map(q=>({type:q.type==='mc'?'mc':q.type==='fill'?'fill':'tr',prompt:String(q.prompt),options:Array.isArray(q.options)&&q.options.length?q.options.map(String):undefined,answer:String(q.answer),wy:{pt:String(q.why||''),en:String(q.why||'')}}));
        if(qz.length>=20){ setQs(qz.slice(0,30)); setPhase('quiz'); return; }
        throw new Error('short');
      }catch(e){ setQs(buildFromPool()); setPhase('quiz'); return; }
    }
    setQs(buildFromPool()); setPhase('quiz');
  };
  const onDone=(sc)=>{ setScore(sc); if(sc>=25){ store.levelUp(); setPhase('pass'); } else setPhase('fail'); };
  if(phase==='intro') return <div className="mx-auto max-w-xl space-y-5">
    <div><h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">{t('lt_title')}</h1><p className="text-slate-500 dark:text-slate-400">{t('lt_sub')}</p></div>
    <div className="rounded-2xl border border-slate-100 bg-white p-6 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900"><p className="text-4xl">🎓</p><p className="mt-2 text-lg font-bold text-slate-900 dark:text-white">{store.profile.level} → {nextName}</p><div className="mt-5 flex justify-center gap-2"><button onClick={()=>done()} className="rounded-xl bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700 dark:bg-slate-800 dark:text-slate-200">{t('lt_cancel')}</button><button onClick={start} className="rounded-xl bg-brand-blue px-5 py-2 text-sm font-semibold text-white">{t('lt_start')}</button></div></div>
  </div>;
  if(phase==='loading') return <div className="mx-auto max-w-xl py-24 text-center text-slate-500 dark:text-slate-400"><span className="inline-block h-3 w-3 animate-pulse rounded-full bg-brand-blue"/><p className="mt-3">{t('lt_loading')}</p></div>;
  if(phase==='quiz') return <div className="mx-auto max-w-2xl space-y-4"><h1 className="text-xl font-extrabold text-slate-900 dark:text-white">{t('lt_title')} · {store.profile.level} → {nextName}</h1><Runner exercises={qs} topic={'Level test '+store.profile.level} store={store} onDone={onDone}/></div>;
  if(phase==='pass') return <div className="mx-auto max-w-xl py-16 text-center"><p className="text-5xl">🎉</p><h1 className="mt-3 text-2xl font-extrabold text-slate-900 dark:text-white">{t('lt_pass_t')}</h1><p className="mt-1 text-slate-600 dark:text-slate-300">{t('lt_pass_s')}{nextName}.</p><p className="mt-1 text-sm text-slate-500">{t('lt_score')}{score}{t('lt_of')}30.</p><button onClick={()=>done()} className="mt-5 rounded-xl bg-brand-blue px-5 py-2.5 text-sm font-semibold text-white">{t('lt_home')}</button></div>;
  return <div className="mx-auto max-w-xl py-16 text-center"><p className="text-5xl">💪</p><h1 className="mt-3 text-2xl font-extrabold text-slate-900 dark:text-white">{t('lt_fail_t')}</h1><p className="mt-1 text-slate-600 dark:text-slate-300">{t('lt_fail_s')}</p><p className="mt-1 text-sm text-slate-500">{t('lt_score')}{score}{t('lt_of')}30.</p><button onClick={()=>done()} className="mt-5 rounded-xl bg-brand-blue px-5 py-2.5 text-sm font-semibold text-white">{t('lt_home')}</button></div>;
}

// The teacher password is NOT stored in the code as plain text — only a
// PBKDF2/SHA-256 hash of it. The entered password is hashed the same way and
// compared. (Full protection comes from the backend in the hosted version.)
const TEACHER_PASS_HASH = 'b8c79bb8cad837ec796b8874ac6203a4a3f6994db63bc0c5fb254a6819af6464';
const TEACHER_PASS_SALT = 'goup-teacher-v1';
const TEACHER_PASS_ITER = 150000;
async function teacherHash(pw){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw', enc.encode(pw), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(TEACHER_PASS_SALT), iterations:TEACHER_PASS_ITER, hash:'SHA-256'}, key, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  const mapRow=(s)=>{ let last=0; try{ const d=new Date(s.lastActive||s.last_active||s.updated_at); last=Math.max(0,Math.floor((Date.now()-d.getTime())/86400000)); }catch(e){} return {name:s.name||'—',email:s.email||'—',level:s.level||'A1',words:Number(s.words)||0,streak:Number(s.streak)||0,minutes:Number(s.minutes)||0,last:last}; };
  const order=['A1','A2','B1','B2','C1','C2'];
  const you = store.profile ? [{name:store.profile.name+' ('+(lang==='pt'?'você':'you')+')',email:store.profile.email||'—',level:store.profile.level,words:store.progress.words,streak:store.progress.streak,minutes:store.progress.minutes,last:0,me:true}] : [];
  const all = remote ? [...you, ...remote.map(mapRow)] : [...you,...EXAMPLE_STUDENTS];
  const list=all.filter(s=>(s.name+' '+s.email).toLowerCase().indexOf(q.toLowerCase())>=0);
  const total=all.length, active=all.filter(s=>s.last===0).length, totalWords=all.reduce((a,s)=>a+s.words,0);
  const avgLevel=order[Math.max(0,Math.round(all.reduce((a,s)=>a+order.indexOf(s.level),0)/all.length))];
  const lastLabel=(d)=> d===0?(lang==='pt'?'hoje':'today'):d===1?(lang==='pt'?'ontem':'yesterday'):(d+(lang==='pt'?' dias':'d'));
  const Stat=({l,v,c})=><div className="rounded-2xl border border-slate-100 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900"><p className="text-xs font-semibold uppercase tracking-wide text-slate-400">{l}</p><p className={'mt-1 text-2xl font-extrabold '+(c||'text-brand-blue dark:text-white')}>{v}</p></div>;
  return <div className="min-h-screen bg-slate-50 dark:bg-slate-950">
    <header className="sticky z-20 flex items-center justify-between border-b border-slate-100 bg-white/90 px-4 py-3 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90" style={{top:'env(safe-area-inset-top,0px)'}}>
      <div className="flex items-center gap-2.5"><img src={LOGO_SRC} alt="Go Up" className="h-9 w-9 rounded-full object-cover"/><div><p className="text-sm font-extrabold text-slate-900 dark:text-white">{t('td_title')}</p><p className="text-[11px] text-slate-400">Go Up School</p></div></div>
      <div className="flex items-center gap-2"><LangToggle/><ThemeBtn/><button onClick={onExit} className="rounded-xl bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-600 dark:bg-slate-800 dark:text-slate-300">{t('td_logout')}</button></div>
    </header>
    <main className="mx-auto max-w-5xl px-4 pb-16 pt-5">
      {!remote && <div className="mb-4 rounded-xl bg-amber-50 px-4 py-2.5 text-xs text-amber-700 dark:bg-amber-500/10 dark:text-amber-300">ℹ️ {t('td_example_note')}</div>}
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        <Stat l={t('td_students')} v={total}/><Stat l={t('td_active')} v={active} c="text-emerald-600"/><Stat l={t('td_avglevel')} v={avgLevel} c="text-violet-600"/><Stat l={t('td_words')} v={totalWords} c="text-brand-red"/>
      </div>
      <div className="mt-5 flex items-center justify-between gap-3">
        <h2 className="font-bold text-slate-900 dark:text-white">{t('td_list')}</h2>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder={t('td_search')} className="w-44 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand-blue dark:border-slate-700 dark:bg-slate-800 dark:text-white"/>
      </div>
      <div className="mt-3 space-y-2">
        {list.map((s,i)=><div key={i} className={'flex flex-wrap items-center justify-between gap-3 rounded-2xl border bg-white p-4 shadow-sm dark:bg-slate-900 '+(s.me?'border-brand-blue':'border-slate-100 dark:border-slate-800')}>
          <div className="min-w-0"><p className="font-bold text-slate-900 dark:text-white">{s.name}</p><p className="text-xs text-slate-400">{s.email}</p></div>
          <div className="flex flex-wrap items-center gap-2 text-xs">
            <span className="rounded-full bg-blue-50 px-2.5 py-1 font-semibold text-brand-blue dark:bg-blue-500/10">{s.level}</span>
            <span className="rounded-full bg-slate-100 px-2.5 py-1 font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">{s.words} {t('td_c_words')}</span>
            <span className="rounded-full bg-slate-100 px-2.5 py-1 font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">🔥 {s.streak}</span>
            <span className="rounded-full bg-slate-100 px-2.5 py-1 font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">{s.minutes} min</span>
            <span className="rounded-full bg-slate-100 px-2.5 py-1 font-medium text-slate-500 dark:bg-slate-800 dark:text-slate-400">{lastLabel(s.last)}</span>
          </div>
        </div>)}
      </div>
    </main>
  </div>;
}

/* ============================ ROOT ============================ */
function initDark(){
  try{ const st=localStorage.getItem(K.theme); if(st==='dark')return true; if(st==='light')return false; const root=document.documentElement; const attr=root.getAttribute('data-theme'); if(attr==='dark')return true; if(attr==='light')return false; }catch(e){}
  try{ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
}
function App(){
  const store=useStore();
  const [dark,setDarkState]=useState(initDark);
  const [lang,setLangState]=useState(()=>read(K.lang,'pt'));
  const [entered,setEntered]=useState(false);
  const [teacher,setTeacher]=useState(()=>{ try{ return localStorage.getItem('goup.teacher')==='1'; }catch(e){ return false; } });
  const [teacherLogin,setTeacherLogin]=useState(false);
  useEffect(()=>{ try{ document.documentElement.classList.toggle('dark',dark); }catch(e){} },[dark]);
  const setDark=(v)=>{ setDarkState(v); write(K.theme, v?'dark':'light'); };
  const setLang=(v)=>{ setLangState(v); write(K.lang, v); };
  const t=useCallback((k)=> (TXT[lang]&&TXT[lang][k]!==undefined)?TXT[lang][k]:(TXT.en[k]!==undefined?TXT.en[k]:k), [lang]);

  let view;
  if(teacher) view = <TeacherDashboard store={store} onExit={()=>{ try{localStorage.removeItem('goup.teacher');}catch(e){} setTeacher(false); }}/>;
  else if(teacherLogin) view = <TeacherLogin onOk={()=>{ try{localStorage.setItem('goup.teacher','1');}catch(e){} setTeacher(true); setTeacherLogin(false); }} onBack={()=>setTeacherLogin(false)}/>;
  else if(store.profile) view = <Shell store={store} onTeacher={()=>setTeacherLogin(true)}/>;
  else if(entered) view = <Onboarding store={store} go={()=>setEntered(true)}/>;
  else view = <Landing go={()=>setEntered(true)} onTeacher={()=>setTeacherLogin(true)}/>;

  return <ThemeCtx.Provider value={{dark,setDark}}><LangCtx.Provider value={{lang,setLang,t}}>{view}</LangCtx.Provider></ThemeCtx.Provider>;
}

if(IS_HOSTED){
  try{ var __p0=read(K.profile,null),__g0=read(K.progress,null); if(__p0&&__g0) syncStudent(__p0,__g0); }catch(e){}
  try{ setInterval(function(){ try{ var p=read(K.profile,null),g=read(K.progress,null); if(p&&g) syncStudent(p,g);}catch(e){} }, 60000); }catch(e){}
  try{ document.addEventListener('visibilitychange',function(){ if(document.hidden){ try{ var p=read(K.profile,null),g=read(K.progress,null); if(p&&g) syncStudent(p,g);}catch(e){} } }); }catch(e){}
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
